<!doctype html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>{{mural.titulo}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/theme.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<!-- reduzir/enviar a foto de fundo: o mural e a tela de aparencia usam o mesmo -->
<script src="/assets/fundo.js"></script>
<style>
  :root{
    --bg: #0A0807;
    --bg-2: #150F0B;
    --ink: #F3E9DC;
    --ink-dim: #A9998A;
    --presenteador: #3E7BFA;
    --presenteador-glow: rgba(62,123,250,.55);
    --presenteador-bg: rgba(62,123,250,.12);
    --membro: #FF7A1A;
    --membro-glow: rgba(255,122,26,.55);
    --membro-bg: rgba(255,122,26,.12);
    --superfa: #C64FF2;
    --superfa-glow: rgba(198,79,242,.55);
    --superfa-bg: rgba(198,79,242,.12);
    --card: #17120E;
    --line: #2B2119;
    --radius: 16px;
    --poster-radius: 18px;
  }

  *{ box-sizing:border-box; }
  /* height:100% no body trava o position:sticky (topbar e painel do formulário).
     O html fica em 100% porque é ele que posiciona o gradiente do fundo. */
  html{ height:100%; }

  body{
    margin:0;
    background:
      radial-gradient(700px 400px at 15% 0%, rgba(255,122,26,.16), transparent 60%),
      radial-gradient(600px 500px at 90% 10%, rgba(62,123,250,.12), transparent 60%),
      radial-gradient(900px 600px at 50% 110%, rgba(255,90,20,.15), transparent 60%),
      var(--bg);
    color: var(--ink);
    font-family:'Rajdhani', sans-serif;
    font-weight:600;
    min-height:100vh;
    padding-bottom:60px;
    position:relative;
    overflow-x:hidden;
  }

  .embers{ position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .ember{
    position:absolute;
    bottom:-10px;
    width:4px; height:4px;
    border-radius:50%;
    background: radial-gradient(circle, #FFB35C 0%, #FF7A1A 60%, transparent 100%);
    opacity:.8;
    animation: rise linear infinite;
  }
  @keyframes rise{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:.9; }
    100%{ transform: translateY(-110vh) translateX(20px); opacity:0; }
  }

  /* ---------- topbar (mesmo padrão do ranking) ---------- */
  .topbar{
    position: sticky; top: 0; z-index: 40;
    background: rgba(10,8,7,.86);
    backdrop-filter: blur(16px) saturate(140%);
    -webkit-backdrop-filter: blur(16px) saturate(140%);
    border-bottom: 1px solid var(--line);
  }
  .topbar-inner{
    max-width: 1180px; margin: 0 auto; padding: 13px 20px;
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
  }
  .topbar-label{
    margin-left: auto; font-size: 11px; font-weight: 700;
    letter-spacing: .18em; text-transform: uppercase; color: var(--ink-faint);
  }

  /* ---------- hero ---------- */
  .hero{ position:relative; z-index:1; padding: 40px 20px 30px; text-align:center; }
  .hero .eyebrow{
    font-size: 11px; letter-spacing:.26em; text-transform:uppercase;
    color: var(--membro); font-weight:700;
  }
  .hero h1{
    font-family:'Bungee', sans-serif; font-weight:400;
    font-size: clamp(28px, 4.6vw, 46px);
    margin: 12px 0 12px; letter-spacing: .02em;
    background: linear-gradient(180deg, #FFD9A8 0%, #FF7A1A 55%, #C6420A 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 26px rgba(255,122,26,.35);
    line-height:1.05;
  }
  .hero p{ color: var(--ink-dim); max-width: 520px; margin: 0 auto; font-size: 14.5px; line-height:1.55; }

  .wrap{
    position:relative; z-index:1;
    max-width: 1180px; margin: 0 auto; padding: 0 20px;
    display:grid; grid-template-columns: 360px minmax(0, 1fr); gap: 22px;
    align-items: start;
  }
  @media (max-width: 900px){ .wrap{ grid-template-columns: 1fr; } }
  @media (max-width: 560px){
    .topbar-inner{ padding: 12px 16px; }
    .hero{ padding: 28px 16px 22px; }
    .wrap{ padding: 0 16px; gap: 16px; }
  }
  /* o formulário acompanha a rolagem enquanto a lista cresce */
  @media (min-width: 901px){
    .wrap > .panel:first-child{ position: sticky; top: 84px; }
  }

  .panel{
    background: linear-gradient(160deg, var(--card), #0D0A08);
    border-radius: var(--radius);
    padding: 22px;
    border: 1px solid var(--line);
    box-shadow: 0 20px 40px -20px rgba(0,0,0,.7);
  }

  .panel h2{
    font-size: 12.5px; font-weight: 700;
    letter-spacing:.14em; text-transform: uppercase; color: var(--ink);
    margin: 0 0 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line-soft);
    display:flex; align-items:center; gap:9px;
  }
  .panel h2::before{
    content:''; width:3px; height:14px; border-radius:2px; flex-shrink:0;
    background: linear-gradient(180deg, #FFB03A, #FF7A1A);
  }

  label{
    display:block; font-size: 12px; letter-spacing:.08em; text-transform:uppercase;
    font-weight: 700; color: var(--ink-dim); margin: 14px 0 6px;
  }
  label:first-of-type{ margin-top:0; }

  input[type=text], input[type=number]{
    width:100%; padding: 11px 12px; border-radius: 10px;
    border: 1.5px solid var(--line); background: #0D0907;
    font-family: 'Rajdhani', sans-serif; font-weight:600; font-size: 15px;
    color: var(--ink); outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder{ color:#5A4C40; }
  input:focus{ border-color: var(--membro); box-shadow: 0 0 0 3px var(--membro-bg); }

  /* --- Biblioteca (quick-add) --- */
  .biblioteca-box{ margin-bottom: 4px; }
  .biblioteca-box label{ display:flex; align-items:center; gap:6px; }
  .chips{
    display:flex; flex-wrap:wrap; gap:6px;
    max-height: 150px; overflow-y:auto;
    padding-right:2px;
  }
  .chip{
    display:flex; align-items:center; gap:6px;
    background:#0D0907; border:1.5px solid var(--line);
    border-radius: 999px; padding: 5px 6px 5px 12px;
    font-size: 13px; font-weight:700; color: var(--ink-dim);
    cursor:pointer; transition: all .12s ease;
  }
  .chip:hover{ border-color:#FF7A1A; color: var(--ink); background: var(--membro-bg); }
  .chip .x{
    width:18px; height:18px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    background:#1D1610; color:#8A7A6A; font-size:11px; line-height:1;
    flex-shrink:0;
  }
  .chip .x:hover{ background:#FF3D1A; color:#fff; }
  .chips-empty{ font-size:12.5px; color:#5A4C40; font-style:italic; }

  .tipo-row{ display:flex; gap:8px; margin-top:6px; }
  .tipo-opt{
    flex:1; text-align:center; padding:9px 4px; border-radius: 10px;
    border: 1.5px solid var(--line); font-size: 12.5px; font-weight:700;
    text-transform:uppercase; letter-spacing:.03em; cursor:pointer; user-select:none;
    transition: all .15s ease; background:#0D0907; color: var(--ink-dim);
  }
  .tipo-opt[data-tipo="presenteador"].active{ background:var(--presenteador-bg); border-color:var(--presenteador); color:#8FB2FF; box-shadow:0 0 14px -2px var(--presenteador-glow) inset; }
  .tipo-opt[data-tipo="membro"].active{ background:var(--membro-bg); border-color:var(--membro); color:#FFB27A; box-shadow:0 0 14px -2px var(--membro-glow) inset; }
  .tipo-opt[data-tipo="superfã"].active{ background:var(--superfa-bg); border-color:var(--superfa); color:#E4A8FA; box-shadow:0 0 14px -2px var(--superfa-glow) inset; }

  .btn{
    font-family:'Bungee', sans-serif; font-weight:400; font-size: 13px;
    letter-spacing:.03em; text-transform:uppercase; border:none; border-radius: 10px;
    padding: 13px 16px; cursor:pointer;
    transition: transform .1s ease, opacity .15s ease, box-shadow .15s ease;
  }
  .btn:active{ transform: scale(.97); }
  .btn-primary{
    background: linear-gradient(90deg, #FF7A1A, #FF3D1A); color:#1A0D05;
    width:100%; margin-top:18px; box-shadow: 0 8px 20px -6px rgba(255,90,20,.55);
  }
  .btn-primary:hover{ opacity:.92; }
  .btn-ghost{ background: transparent; border:1.5px solid var(--line); color: var(--ink-dim); }
  .btn-ghost:hover{ border-color:#5A4C40; color:var(--ink); }
  .btn-danger{ background: rgba(255,61,26,.14); border:1.5px solid rgba(255,61,26,.4); color:#FF8A6A; }

  #cancelEdit{ display:none; width:100%; margin-top:8px; }

  .patches{ display:flex; flex-direction:column; gap:10px; }

  .patch{
    display:flex; align-items:center; justify-content:space-between; gap: 12px;
    padding: 12px 18px; border-radius: 999px;
    background: linear-gradient(90deg, #100C09, #17110C);
    border: 1.5px solid var(--line);
  }
  .patch.presenteador{ border-color: rgba(62,123,250,.55); box-shadow: 0 0 22px -8px var(--presenteador-glow), inset 0 0 14px -6px var(--presenteador-glow); }
  .patch.membro{ border-color: rgba(255,122,26,.55); box-shadow: 0 0 22px -8px var(--membro-glow), inset 0 0 14px -6px var(--membro-glow); }
  .patch.superfã{ border-color: rgba(198,79,242,.55); box-shadow: 0 0 22px -8px var(--superfa-glow), inset 0 0 14px -6px var(--superfa-glow); }

  .patch .side-icon{ flex-shrink:0; width:26px; height:26px; display:flex; align-items:center; justify-content:center; }
  .patch.presenteador .side-icon{ color: var(--presenteador); }
  .patch.membro .side-icon{ color: var(--membro); }
  .patch.superfã .side-icon{ color: var(--superfa); }
  .side-icon svg{ width:18px; height:18px; }

  .patch .info{ flex:1; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; min-width:0; }
  .patch .nome{ font-family:'Bungee', sans-serif; font-weight:400; font-size:14px; color: var(--ink); white-space:nowrap; }
  .patch .texto{ color: var(--ink-dim); font-size: 13.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .patch-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    background:#0D0907; border:1px solid var(--line); border-radius:8px;
    width:28px; height:28px; display:flex; align-items:center; justify-content:center;
    cursor:pointer; font-size:13px; color: var(--ink-dim);
  }
  .icon-btn:hover{ background:#1D1610; color: var(--ink); }

  .empty{
    text-align:center; color: var(--ink-dim); font-size: 14px; padding: 34px 10px;
    border: 1.5px dashed var(--line); border-radius: 14px;
  }

  .group-title{
    font-family:'Bungee', sans-serif; font-weight:400; font-size: 11.5px;
    text-transform:uppercase; letter-spacing:.1em; color: var(--ink-dim); margin: 18px 4px 8px;
  }
  .group-title:first-child{ margin-top:0; }

  .toast{
    position: fixed; bottom: 24px; left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: linear-gradient(90deg, #FF7A1A, #FF3D1A); color: #1A0D05;
    padding: 11px 20px; border-radius: 999px;
    font-family:'Bungee', sans-serif; font-weight:400; font-size: 12.5px;
    text-transform:uppercase; letter-spacing:.03em;
    opacity: 0; pointer-events:none; transition: all .25s ease; z-index:5;
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }

  .count-pill{
    font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:700;
    color: var(--ink-dim); background: #0D0907; border: 1px solid var(--line);
    padding: 2px 10px; border-radius: 999px; margin-left:auto;
  }

  .poster-section{ margin-top: 28px; }

  .poster-wrap{
    position:relative;
    width:100%;
    max-width: 420px;
    aspect-ratio: 9 / 16;
    /* Sem min-height:0 o aspect-ratio é só uma preferência: passando de ~8
       pessoas as linhas empurravam o poster pra baixo e ele saía mais alto que
       9:16 (com 20 pessoas virava 420x1248). Aí o Stories cortava o PNG. */
    min-height: 0;
    overflow: hidden;
    margin: 0 auto;
    border-radius: var(--poster-radius);
    border: none;
    background: #000;
    display:flex;
    flex-direction:column;
    isolation:isolate;
  }

  .poster-img-area{
    position:relative; z-index:1;
    width:100%;
    flex: 0 0 var(--photo-basis, 56%);
    overflow:hidden;
    background-color:#000;
    background-size: cover;
    background-position: center top;
    background-repeat: no-repeat;
  }

  /* SEM FOTO ESCOLHIDA.
     O fundo não se herda (ver fundos.js): quem não escolheu foto não recebe a
     de outra live. Recebe um degradê nas cores da PRÓPRIA marca — o story sai
     apresentável mesmo assim, e o aviso em cima diz o que falta. Degradê de
     CSS o html2canvas captura, então a imagem baixada fica igual à da tela. */
  .poster-img-area.sem-foto{
    background-image:
      /* a camada escura POR CIMA: sem ela as cores da marca viram um holofote
         laranja e o nome de quem está na lista some em cima dele. O fundo é
         fundo -- tem que ficar atrás do que importa */
      linear-gradient(180deg, rgba(0,0,0,.42) 0%, rgba(0,0,0,.66) 70%, rgba(0,0,0,.8) 100%),
      radial-gradient(110% 80% at 50% 2%, var(--ember1) 0%, transparent 58%),
      radial-gradient(80% 60% at 88% 95%, var(--ember2) 0%, transparent 52%),
      linear-gradient(170deg, var(--card) 0%, var(--bg) 100%);
  }

  /* o convite pra escolher a foto, dentro da própria área da imagem */
  /* O [hidden] sozinho nao vence o display:flex abaixo -- a regra do elemento
     tem mais peso que a do navegador. Sem esta linha o convite "escolha o
     fundo" fica escrito POR CIMA da foto de quem ja escolheu uma, e o JS jura
     que escondeu. O mural nao carrega o painel.css, que ja traz essa regra. */
  .fundo-vazio[hidden]{ display:none; }
  .fundo-vazio{
    position:absolute; inset:0; z-index:6;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:10px; padding:18px; text-align:center;
  }
  .fundo-vazio .tit{
    font-family:'Bungee', sans-serif; font-size:13px; letter-spacing:.06em;
    color:#fff; text-shadow:0 2px 10px rgba(0,0,0,.7); line-height:1.35;
  }
  .fundo-vazio .sub{ font-size:11px; color:rgba(255,255,255,.72); max-width:230px; line-height:1.45; }
  .fundo-vazio button{
    font:inherit; font-size:12px; font-weight:700; cursor:pointer;
    padding:8px 15px; border-radius:999px; border:1.5px solid rgba(255,255,255,.35);
    background:rgba(0,0,0,.45); color:#fff; backdrop-filter: blur(2px);
  }
  .fundo-vazio button:hover{ border-color:#FF7A1A; background:rgba(255,122,26,.25); }

  /* a troca de foto, embaixo do poster */
  .fundo-barra{
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    justify-content:center; margin-top:10px;
    font-size:12px; color: var(--ink-dim);
  }
  .fundo-barra button{
    font:inherit; font-size:12px; cursor:pointer;
    padding:6px 12px; border-radius:8px;
    border:1px solid var(--line); background:#0D0907; color: var(--ink-dim);
  }
  .fundo-barra button:hover{ border-color:#FF7A1A; color: var(--ink); }
  .fundo-barra .ocupado{ opacity:.55; pointer-events:none; }

  .poster-vignette{
    position:absolute; inset:0;
    background:
      radial-gradient(120% 90% at 50% 38%, rgba(0,0,0,0) 40%, rgba(0,0,0,.5) 78%, rgba(0,0,0,.92) 100%);
    z-index:2;
    pointer-events:none;
    opacity:0;
    transition: opacity .25s ease;
  }

  .poster-img-fade{
    position:absolute; left:0; right:0; bottom:0;
    height:42%;
    background: linear-gradient(to bottom,
      rgba(0,0,0,0) 0%,
      rgba(0,0,0,.15) 25%,
      rgba(0,0,0,.6) 55%,
      rgba(0,0,0,.92) 80%,
      rgba(0,0,0,1) 100%);
    pointer-events:none;
    z-index:3;
    opacity:0;
    transition: opacity .25s ease;
  }

  .poster-wrap.tem-gente .poster-vignette,
  .poster-wrap.tem-gente .poster-img-fade{
    opacity:1;
  }

  .poster-embers{ position:absolute; inset:0; z-index:4; pointer-events:none; overflow:hidden; }
  .poster-ember{
    position:absolute;
    border-radius:50%;
    background: radial-gradient(circle, #FFD9A8 0%, #FF7A1A 55%, transparent 100%);
    filter: blur(.5px);
    animation: posterFloat ease-in-out infinite;
  }
  @keyframes posterFloat{
    0%, 100%{ transform: translateY(0); }
    50%{ transform: translateY(-8px); }
  }

  .poster-rows{
    position:relative; z-index:5;
    flex: 1 1 auto;
    min-height:0;
    display:flex;
    flex-direction:column;
    justify-content:center;
    gap: var(--row-gap, 8px);
    padding: 10px 14px 16px;
    margin-top: -34px;
    background: #000;
    overflow:hidden;
  }
  .poster-rows:empty{ margin-top:0; padding:0; background:none; }

  .imagem-pronta{
    display:none; max-width:420px; margin:14px auto 0;
    background: var(--card-2, #0f0b08); border:1px solid rgba(255,122,26,.45);
    border-radius:14px; padding:12px; text-align:center;
  }
  .imagem-pronta.show{ display:block; }
  .imagem-pronta img{ width:100%; border-radius:10px; display:block; }
  .imagem-pronta .dica{
    margin-top:10px; font-size:13px; font-weight:700; color:#FFC98A; line-height:1.4;
  }
  .imagem-pronta .fechar{
    margin-top:10px; background:none; border:1px solid rgba(255,255,255,.2);
    color:#C9B9A6; border-radius:999px; padding:6px 16px;
    font-family:'Rajdhani',sans-serif; font-weight:700; font-size:12.5px; cursor:pointer;
  }

  .poster-aviso{
    max-width: 420px; margin: 10px auto 0;
    padding: 8px 12px; border-radius: 10px;
    background: rgba(255,122,26,.12); border: 1px solid rgba(255,122,26,.45);
    color: #FFC98A; font-size: 12.5px; font-weight: 600; text-align:center;
  }

  .poster-row{
    display:flex; align-items:center; justify-content:space-between;
    gap: 10px;
    padding: var(--row-pad-v, 9px) var(--row-pad-h, 14px);
    border-radius: 999px;
    background: linear-gradient(90deg, rgba(15,11,8,.92), rgba(23,17,12,.92));
    border: 1.5px solid var(--line);
    flex-shrink:0;
  }
  .poster-row.presenteador{ border-color: rgba(62,123,250,.65); box-shadow: 0 0 14px -4px var(--presenteador-glow); }
  .poster-row.membro{ border-color: rgba(255,122,26,.65); box-shadow: 0 0 14px -4px var(--membro-glow); }
  .poster-row.superfã{ border-color: rgba(198,79,242,.65); box-shadow: 0 0 14px -4px var(--superfa-glow); }

  .poster-row .side-icon{ flex-shrink:0; width: var(--row-icon, 20px); height: var(--row-icon, 20px); display:flex; align-items:center; justify-content:center; }
  .poster-row .side-icon svg{ width:100%; height:100%; }
  .poster-row.presenteador .side-icon{ color: var(--presenteador); }
  .poster-row.membro .side-icon{ color: var(--membro); }
  .poster-row.superfã .side-icon{ color: var(--superfa); }

  .poster-row .info{ flex:1; display:flex; flex-direction:row; align-items:baseline; gap: 8px; min-width:0; }
  .poster-row .nome{ font-family:'Bungee', sans-serif; font-weight:400; font-size: var(--row-font-nome, 13px); color:#FBEFE1; white-space:nowrap; flex-shrink:0; }
  .poster-row .texto{ font-size: var(--row-font-texto, 10.5px); color:#C9B9A6; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; flex:1; }

  .poster-actions{
    display:flex; gap:10px; justify-content:center; margin-top:16px; flex-wrap:wrap;
  }
</style>
{{tema}}
</head>
<body>
{{barraEspiando}}

<div class="embers" id="embers"></div>

<header class="topbar">
  <div class="topbar-inner">
    <a class="app-btn" href="/index.html">⬅️ Voltar pro Ranking</a>
    <span class="topbar-label">Gerador de arte</span>
  </div>
</header>

<section class="hero">
  <div class="eyebrow">Mural</div>
  <h1>{{mural.titulo}}</h1>
  <p>{{mural.sub}}</p>
</section>

<div class="wrap">

  <!-- FORM -->
  <div class="panel">
    <h2>➕ ADICIONAR</h2>

    <div class="biblioteca-box" id="bibliotecaBox" style="display:none;">
      <label>⚡ Usar de novo</label>
      <div class="chips" id="bibliotecaChips"></div>
    </div>

    <label for="nome">Nome</label>
    <input type="text" id="nome" placeholder="Ex: Eliton Silva" />

    <div id="nivelGroup">
      <label for="nivel">Nível</label>
      <input type="number" id="nivel" placeholder="Ex: 22" />
    </div>

    <label>Tipo</label>
    <div class="tipo-row" id="tipoRow">
      <div class="tipo-opt" data-tipo="presenteador">Presenteador</div>
      <div class="tipo-opt" data-tipo="membro">Membro</div>
      <div class="tipo-opt" data-tipo="superfã">Superfã</div>
    </div>

    <button class="btn btn-primary" id="saveBtn">Adicionar à lista</button>
    <button class="btn btn-ghost" id="cancelEdit">Cancelar edição</button>
  </div>

  <!-- LIST + POSTER -->
  <div class="panel">
    <h2>📋 LISTA <span class="count-pill" id="countPill">0</span></h2>
    <div class="patches" id="patches"></div>

    <div class="poster-section">
      <h2>🖼️ IMAGEM FINAL</h2>

      <div class="poster-wrap" id="posterWrap">
        <div class="poster-img-area" id="posterImgArea">
          <div class="poster-vignette"></div>
          <div class="poster-img-fade"></div>
          <!-- Só aparece enquanto a live não tem foto própria. Fica DENTRO da
               área da imagem porque é ali que falta algo — e sai da captura
               antes de gerar o PNG. -->
          <div class="fundo-vazio" id="fundoVazio" hidden>
            <div class="tit">ESCOLHA O FUNDO<br>DA SUA TROPA</div>
            <div class="sub">Esta foto é a sua — ela vai atrás do mural no story.</div>
            <button type="button" id="fundoEscolherVazio">🖼️ Escolher foto</button>
          </div>
        </div>
        <div class="poster-embers" id="posterEmbers"></div>
        <div class="poster-rows" id="posterRows"></div>
      </div>

      <!-- trocar o fundo aqui, onde se vê o resultado, em vez de obrigar uma
           ida até a tela de aparência -->
      <div class="fundo-barra" id="fundoBarra">
        <input type="file" id="fundoArquivo" accept="image/jpeg,image/png,image/webp" hidden>
        <button type="button" id="fundoTrocar">🖼️ Trocar o fundo</button>
        <button type="button" id="fundoRemover" hidden>Tirar a foto</button>
        <span id="fundoStatus"></span>
      </div>

      <div class="poster-aviso" id="posterAviso" hidden></div>

      <div class="imagem-pronta" id="imagemPronta">
        <img id="imagemProntaImg" alt="Imagem do mural gerada">
        <div class="dica" id="imagemProntaDica"></div>
        <button class="fechar" id="imagemProntaFechar">Fechar</button>
      </div>

      <div class="poster-actions">
        <button class="btn btn-primary" id="downloadImgBtn" style="width:auto; margin-top:0;">⬇️ Baixar imagem (PNG)</button>
        <button class="btn btn-danger" id="clearBtn" style="width:auto; margin-top:0;">🗑️ Limpar Lista</button>
      </div>
    </div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
  // ---------- Ícones (SVG inline, cor herdada via currentColor) ----------
  const ICONS = {
    gift: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 12 20 22 4 22 4 12"></polyline><rect x="2" y="7" width="20" height="5"></rect><line x1="12" y1="22" x2="12" y2="7"></line><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path></svg>',
    arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><polyline points="16 13 12 9 8 13"></polyline><line x1="12" y1="16" x2="12" y2="9"></line></svg>',
    star: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>',
    crown: '<svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M3 8l4.2 3 4.8-6.2L16.8 11 21 8l-2 10H5L3 8z"></path></svg>',
  };

  const TIPO_ICONS = {
    presenteador: { left: 'gift', right: 'gift' },
    membro: { left: 'arrow', right: 'crown' },
    superfã: { left: 'star', right: 'crown' },
  };

  // O nome da tropa é o apelido que a pessoa escolheu no TikTok: texto de fora,
  // e tudo aqui é montado com innerHTML. Sem isto, um apelido com "<" injeta
  // HTML na tela de quem está vendo o mural.
  function esc(txt) {
    return String(txt ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  // ---------- Brasas de fundo ----------
  const embersEl = document.getElementById('embers');
  for (let i = 0; i < 26; i++){
    const e = document.createElement('div');
    e.className = 'ember';
    const size = 2 + Math.random() * 4;
    e.style.left = Math.random() * 100 + 'vw';
    e.style.width = size + 'px';
    e.style.height = size + 'px';
    e.style.animationDuration = (7 + Math.random() * 9) + 's';
    e.style.animationDelay = (Math.random() * 10) + 's';
    embersEl.appendChild(e);
  }

  // ---------- Estado: lista atual ----------
  const STORAGE_KEY = 'mural-da-tropa-pessoas';
  let pessoas = JSON.parse(localStorage.getItem(STORAGE_KEY) || '[]');
  const socket = io();

function upsertPessoaAuto({ nome, nivel, tipo, avatar }) {
  const existente = pessoas.find(p =>
    p.nome.toLowerCase() === nome.toLowerCase() && p.tipo === tipo
  );
  if (existente) {
    if (parseInt(existente.nivel) >= nivel) return;
    existente.nivel = nivel;
  } else {
    pessoas.push({ id: Date.now() + Math.random(), nome, nivel, tipo });
    upsertBiblioteca(nome);
  }
  salvar();
  render();
}

socket.on('tropa_init', lista => {
  lista.forEach(upsertPessoaAuto);
});

socket.on('tropa_add', item => {
  upsertPessoaAuto(item);
  // superfã não tem nível — o aviso antigo saía como "subiu pra nível 1"
  showToast(item.tipo === 'superfã'
    ? `⭐ ${item.nome} se tornou superfã`
    : `🔥 ${item.nome} subiu pra nível ${item.nivel} (${item.tipo})`);
});
  // ---------- Estado: biblioteca de nomes salvos (reuso rápido) ----------
  const BIBLIOTECA_KEY = 'mural-da-tropa-biblioteca';
  let biblioteca = JSON.parse(localStorage.getItem(BIBLIOTECA_KEY) || '[]');

  let tipoSelecionado = 'presenteador';
  let editandoId = null;

  const nomeInput = document.getElementById('nome');
  const nivelInput = document.getElementById('nivel');
  const tipoRow = document.getElementById('tipoRow');
  const saveBtn = document.getElementById('saveBtn');
  const cancelEditBtn = document.getElementById('cancelEdit');
  const patchesEl = document.getElementById('patches');
  const countPill = document.getElementById('countPill');
  const toast = document.getElementById('toast');
  const bibliotecaBox = document.getElementById('bibliotecaBox');
  const bibliotecaChips = document.getElementById('bibliotecaChips');

  tipoRow.addEventListener('click', (e) => {
    const opt = e.target.closest('.tipo-opt');
    if (!opt) return;
    tipoSelecionado = opt.dataset.tipo;
    renderTipoOptions();
  });

  const nivelGroup = document.getElementById('nivelGroup');

  function renderTipoOptions(){
    [...tipoRow.children].forEach(el => {
      el.classList.toggle('active', el.dataset.tipo === tipoSelecionado);
    });
    // Superfã não tem "nível" — vira superfã e pronto, sem precisar informar nada a mais.
    const isSuperfa = tipoSelecionado === 'superfã';
    nivelGroup.style.display = isSuperfa ? 'none' : '';
    if (isSuperfa) nivelInput.value = '';
  }

  function salvar(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(pessoas)); }
  function salvarBiblioteca(){ localStorage.setItem(BIBLIOTECA_KEY, JSON.stringify(biblioteca)); }

  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 1600);
  }

  // ---------- Biblioteca: salvar / usar / remover ----------
  function upsertBiblioteca(nome){
    if (!nome) return;
    const idx = biblioteca.findIndex(b => b.nome.toLowerCase() === nome.toLowerCase());
    if (idx === -1){
      biblioteca.push({ nome });
      salvarBiblioteca();
      renderBiblioteca();
    }
  }

  function usarDaBiblioteca(nome){
    nomeInput.value = nome;
    nivelInput.focus();
  }

  function removerDaBiblioteca(nome, ev){
    ev.stopPropagation();
    biblioteca = biblioteca.filter(b => b.nome !== nome);
    salvarBiblioteca();
    renderBiblioteca();
  }

  function renderBiblioteca(){
    if (!biblioteca.length){
      bibliotecaBox.style.display = 'none';
      return;
    }
    bibliotecaBox.style.display = 'block';
    const ordenada = [...biblioteca].sort((a,b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    // O JSON.stringify sozinho não bastava: ele fecha a string do JS, não o
    // atributo — um nome com apóstrofo terminava o onclick='...' e o resto do
    // nome virava HTML. Escapado, o navegador desfaz as entidades antes de o JS
    // ler a chamada, então o nome chega inteiro na função.
    bibliotecaChips.innerHTML = ordenada.map(b => `
      <div class="chip" onclick='usarDaBiblioteca(${esc(JSON.stringify(b.nome))})'>
        <span>${esc(b.nome)}</span>
        <span class="x" onclick='removerDaBiblioteca(${esc(JSON.stringify(b.nome))}, event)' title="Remover da biblioteca">✕</span>
      </div>
    `).join('');
  }

  // ---------- Adicionar / editar pessoa na lista atual ----------
  saveBtn.addEventListener('click', () => {
    const nome = nomeInput.value.trim();
    const nivel = nivelInput.value.trim();

    if (!nome){ nomeInput.focus(); return; }

    if (editandoId){
      const p = pessoas.find(p => p.id === editandoId);
      Object.assign(p, { nome, nivel, tipo: tipoSelecionado });
      editandoId = null;
      saveBtn.textContent = 'Adicionar à lista';
      cancelEditBtn.style.display = 'none';
      showToast('Atualizado ✓');
    } else {
      pessoas.push({ id: Date.now(), nome, nivel, tipo: tipoSelecionado });
      showToast(tipoSelecionado === 'superfã' ? `🔥 ${nome} se tornou superfã` : 'Adicionado ✓');
    }

    upsertBiblioteca(nome);

    nomeInput.value = ''; nivelInput.value = '';
    nomeInput.focus();
    salvar();
    render();
  });

  cancelEditBtn.addEventListener('click', () => {
    editandoId = null;
    nomeInput.value = ''; nivelInput.value = '';
    saveBtn.textContent = 'Adicionar à lista';
    cancelEditBtn.style.display = 'none';
  });

  function editar(id){
    const p = pessoas.find(p => p.id === id);
    if (!p) return;
    editandoId = id;
    nomeInput.value = p.nome;
    nivelInput.value = p.nivel;
    tipoSelecionado = p.tipo;
    renderTipoOptions();
    saveBtn.textContent = 'Salvar alteração';
    cancelEditBtn.style.display = 'block';
    nomeInput.focus();
  }

  async function excluir(id){
    const alvo = pessoas.find(p => p.id === id);
    pessoas = pessoas.filter(p => p.id !== id);
    salvar();
    render();
    if (!alvo) return;

    // Apagar só aqui não bastava: o servidor guarda a própria lista e devolvia
    // a pessoa no tropa_init do próximo F5.
    try {
      const res = await fetch('/api/tropa/remover', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nome: alvo.nome, tipo: alvo.tipo })
      });
      if (!res.ok) throw new Error('falhou');
    } catch (e) {
      showToast('⚠️ Apaguei só nesta tela — o servidor não respondeu');
    }
  }

  // Outra aba apagou alguém: acompanha, pra não ressuscitar a pessoa daqui.
  socket.on('tropa_removida', ({ nome, tipo }) => {
    const antes = pessoas.length;
    pessoas = pessoas.filter(p =>
      !(String(p.nome).toLowerCase() === String(nome).toLowerCase() && p.tipo === tipo)
    );
    if (pessoas.length !== antes) { salvar(); render(); }
  });

  document.getElementById('clearBtn').addEventListener('click', async () => {
    if (!pessoas.length) return;
    if (!confirm('Apagar todo mundo da lista? (a biblioteca de nomes não é afetada)')) return;

    pessoas = [];
    salvar();
    render();

    // Limpar só aqui não bastava: o servidor guarda a própria lista e mandava
    // todo mundo de volta no tropa_init do próximo carregamento — aí gente que
    // já tinha saído no print da semana passada reaparecia.
    try {
      const res = await fetch('/api/tropa/limpar', { method: 'POST' });
      if (!res.ok) throw new Error('falhou');
      showToast('Lista limpa ✓');
    } catch (e) {
      showToast('⚠️ Limpei só nesta tela — o servidor não respondeu');
    }
  });

  // Outra aba/navegador limpou: acompanha, pra não ressuscitar a lista daqui.
  socket.on('tropa_limpa', () => {
    if (!pessoas.length) return;
    pessoas = [];
    salvar();
    render();
    showToast('Lista limpa em outro dispositivo');
  });

  const ORDEM_TIPOS = [
    { key: 'superfã', label: 'Superfãs' },
    { key: 'presenteador', label: 'Presenteadores' },
    { key: 'membro', label: 'Membros' },
  ];

  function render(){
    renderTipoOptions();
    countPill.textContent = pessoas.length;

    if (!pessoas.length){
      patchesEl.innerHTML = `<div class="empty">Ninguém cadastrado ainda. Adicione alguém ao lado 👈</div>`;
      renderPoster();
      return;
    }

    let html = '';
    ORDEM_TIPOS.forEach(grupo => {
      // Aqui filtramos por grupo e ORDENAMOS pelo nível do maior para o menor
      const doGrupo = pessoas
        .filter(p => p.tipo === grupo.key)
        .sort((a, b) => (parseInt(b.nivel) || 0) - (parseInt(a.nivel) || 0));

      if (!doGrupo.length) return;
      html += `<div class="group-title">${grupo.label} · ${doGrupo.length}</div>`;
      doGrupo.forEach(p => {
        const icons = TIPO_ICONS[p.tipo];
        const nivelTxt = p.tipo === 'superfã'
          ? 'se tornou superfã'
          : (p.nivel ? `atingiu o nível ${p.nivel} de ${p.tipo}` : `é ${p.tipo}`);
        html += `
          <div class="patch ${p.tipo}">
            <span class="side-icon">${ICONS[icons.left]}</span>
            <div class="info">
              <span class="nome">${esc(p.nome)}</span>
              <span class="texto">${nivelTxt}</span>
            </div>
            <div class="patch-actions">
              <div class="icon-btn" onclick="editar(${p.id})" title="Editar">✏️</div>
              <div class="icon-btn" onclick="excluir(${p.id})" title="Excluir">🗑️</div>
            </div>
            <span class="side-icon">${ICONS[icons.right]}</span>
          </div>`;
      });
    });
    patchesEl.innerHTML = html;
    renderPoster();
  }

  // ---------- Imagem final (poster) ----------
  const posterWrap = document.getElementById('posterWrap');
  const posterAviso = document.getElementById('posterAviso');
  const posterImgArea = document.getElementById('posterImgArea');
  const posterRows = document.getElementById('posterRows');
  const posterEmbersEl = document.getElementById('posterEmbers');
  const downloadImgBtn = document.getElementById('downloadImgBtn');

  // ---------- Pré-carrega a foto em resolução PLENA antes de qualquer captura ----------
  // Problema que isso resolve: o navegador escolhe a resolução de decodificação
  // de uma background-image com base no tamanho em que ela está sendo EXIBIDA
  // na tela (o card pequeno, uns 380-420px). Se a gente só usa background-image
  // direto no CSS, o html2canvas às vezes reaproveita essa versão "amassada"
  // do cache em vez do arquivo original — e a foto sai borrada no PNG final,
  // mesmo o arquivo original tendo qualidade boa.
  // Solução: carregar o arquivo manualmente com new Image(), forçar o decode()
  // em resolução nativa, e só então aplicar como fundo. Assim o navegador é
  // obrigado a manter a versão em alta resolução decodificada e disponível
  // pro html2canvas usar na hora de gerar o PNG.
  // A FOTO É DESTA LIVE, não do site.
  //
  // Era `./assets/foto_da_tropa_hd.jpg` cravado aqui — um arquivo só pro site
  // inteiro. Resultado: todo streamer gerava o story dele com a foto da tropa
  // do Borba. Agora o endereço é o mesmo pra todos (`/api/fundo`) e o servidor
  // entrega a foto de quem está logado; quem não escolheu nenhuma leva 404, que
  // aqui não é erro — é o estado "ainda não escolhi", e liga o degradê das
  // cores da própria marca.
  let fotoPronta = false;
  let temFundo = false;

  // o `?v=` só entra depois de uma troca: na carga normal a URL é fixa e o
  // ETag do servidor resolve (304 quando não mudou)
  function carregarFotoEmAltaResolucao(versao){
    const url = Fundo.url(null, versao);
    fotoPronta = false;

    const img = new Image();
    img.src = url;
    // decode() força o navegador a processar a imagem em resolução nativa
    // ANTES de resolver a promise — diferente de só esperar o evento "load".
    const decodePromise = img.decode
      ? img.decode()
      : new Promise((ok, falha) => { img.onload = ok; img.onerror = falha; });

    return decodePromise
      .then(() => {
        posterImgArea.style.backgroundImage = `url('${url}')`;
        posterImgArea.classList.remove('sem-foto');
        temFundo = true;
      })
      .catch(() => {
        // não carregou: ou esta live não escolheu foto (404), ou a rede falhou.
        // Os dois acabam no mesmo lugar, e o degradê é um fundo apresentável —
        // melhor que um retângulo preto sem explicação.
        posterImgArea.style.backgroundImage = '';
        posterImgArea.classList.add('sem-foto');
        temFundo = false;
      })
      .then(() => {
        fotoPronta = true;   // em qualquer um dos dois casos, dá pra gerar
        ajustarBarraDoFundo();
      });
  }

  // ---------- trocar o fundo aqui mesmo ----------
  const fundoVazio    = document.getElementById('fundoVazio');
  const fundoArquivo  = document.getElementById('fundoArquivo');
  const fundoTrocar   = document.getElementById('fundoTrocar');
  const fundoRemover  = document.getElementById('fundoRemover');
  const fundoStatus   = document.getElementById('fundoStatus');
  const fundoBarra    = document.getElementById('fundoBarra');

  function ajustarBarraDoFundo(){
    fundoVazio.hidden = temFundo;
    fundoRemover.hidden = !temFundo;
    fundoTrocar.textContent = temFundo ? '🖼️ Trocar o fundo' : '🖼️ Escolher o fundo';
  }

  // Reduzir e enviar moram no assets/fundo.js: a tela de aparência mexe na
  // mesma foto, e duas contas diferentes fariam a mesma imagem sair com
  // qualidade diferente dependendo de onde foi escolhida.
  async function enviarFundo(file){
    fundoBarra.classList.add('ocupado');
    fundoStatus.textContent = 'Preparando…';
    try {
      await Fundo.enviar(file);
      await carregarFotoEmAltaResolucao(Date.now());
      fundoStatus.textContent = '';
      showToast('Fundo atualizado ✓');
      renderPoster();
    } catch (e) {
      fundoStatus.textContent = '';
      alert('Não deu pra trocar o fundo: ' + (e.message || 'erro desconhecido'));
    } finally {
      fundoBarra.classList.remove('ocupado');
    }
  }

  fundoTrocar.addEventListener('click', () => fundoArquivo.click());
  document.getElementById('fundoEscolherVazio')
    .addEventListener('click', () => fundoArquivo.click());

  fundoArquivo.addEventListener('change', () => {
    const file = fundoArquivo.files && fundoArquivo.files[0];
    fundoArquivo.value = '';   // senão escolher o MESMO arquivo de novo não dispara
    if (file) enviarFundo(file);
  });

  fundoRemover.addEventListener('click', async () => {
    if (!confirm('Tirar a foto de fundo? O mural volta a usar as cores da sua marca.')) return;
    fundoBarra.classList.add('ocupado');
    try {
      await Fundo.remover();
      await carregarFotoEmAltaResolucao(Date.now());
      showToast('Foto removida');
      renderPoster();
    } catch (e) {
      alert('Não deu pra tirar a foto.');
    } finally {
      fundoBarra.classList.remove('ocupado');
    }
  });

  carregarFotoEmAltaResolucao();

  // ---------- Ajuste dinâmico pra sempre caber tudo ----------
  // Em vez de "adivinhar" o encolhimento pela quantidade de pessoas, aqui a
  // gente MEDE o espaço de verdade depois de desenhar as linhas:
  //   1) primeiro tenta em tamanho cheio;
  //   2) se não coube, encolhe só as linhas (fonte/respiro/ícone) até um
  //      piso legível;
  //   3) só se ainda assim não couber, tira um pouco de espaço do ursinho
  //      (repetindo o passo 2 a cada corte, porque sobrou mais espaço pras
  //      linhas) — assim a foto só encolhe quando é realmente necessário.
  const POSTER_BASE = { pad: 8, gap: 7, fontNome: 13, fontTexto: 11, icon: 18 };
  // Dois pisos: enquanto a foto ainda tem espaço pra ceder, as linhas param no
  // "conforto" (texto ainda legível no story). O piso de verdade só vale quando
  // a foto já está no mínimo — aí é espremer ou cortar, e cortar é pior.
  const ROW_ESCALA_CONFORTO = 0.72;
  const ROW_ESCALA_MIN = 0.42;   // linhas nunca ficam menores que 42% do tamanho cheio
  const FOTO_MAX = 54, FOTO_MIN = 18, FOTO_PASSO = 4;

  function aplicarTamanhoPoster(fotoPct, escala){
    const root = document.documentElement.style;
    root.setProperty('--photo-basis', fotoPct + '%');
    root.setProperty('--row-pad-v', (POSTER_BASE.pad * escala).toFixed(2) + 'px');
    root.setProperty('--row-gap', (POSTER_BASE.gap * escala).toFixed(2) + 'px');
    root.setProperty('--row-font-nome', (POSTER_BASE.fontNome * escala).toFixed(2) + 'px');
    root.setProperty('--row-font-texto', (POSTER_BASE.fontTexto * escala).toFixed(2) + 'px');
    root.setProperty('--row-icon', (POSTER_BASE.icon * escala).toFixed(2) + 'px');
  }

  // O scrollHeight não serve pra medir aqui: com justify-content:center o que
  // não cabe sobra metade pra cima, e essa metade o scrollHeight não conta.
  // Então somamos as linhas de verdade.
  function alturaNecessariaDasLinhas(){
    const linhas = posterRows.children;
    if (!linhas.length) return 0;
    const cs = getComputedStyle(posterRows);
    const gap = parseFloat(cs.rowGap) || 0;
    const padding = (parseFloat(cs.paddingTop) || 0) + (parseFloat(cs.paddingBottom) || 0);
    let total = padding + gap * (linhas.length - 1);
    for (const linha of linhas) total += linha.getBoundingClientRect().height;
    return total;
  }

  function ajustarPosterParaCaber(qtd){
    if (qtd === 0){ aplicarTamanhoPoster(FOTO_MAX, 1); return; }

    let foto = FOTO_MAX;
    let escala = 1;
    aplicarTamanhoPoster(foto, escala);

    for (let tentativa = 0; tentativa < 24; tentativa++){
      const disponivel = posterRows.clientHeight;
      const necessario = alturaNecessariaDasLinhas();
      if (necessario <= disponivel + 0.5) break; // coube tudo

      const escalaNecessaria = disponivel / necessario;
      const piso = foto > FOTO_MIN ? ROW_ESCALA_CONFORTO : ROW_ESCALA_MIN;
      const novaEscala = Math.max(piso, escala * escalaNecessaria);

      if (novaEscala < escala - 0.001){
        escala = novaEscala;
        aplicarTamanhoPoster(foto, escala);
        continue;
      }

      // linhas já no piso — cede um pouco de espaço da foto e tenta de novo
      if (foto > FOTO_MIN){
        foto = Math.max(FOTO_MIN, foto - FOTO_PASSO);
        escala = 1;
        aplicarTamanhoPoster(foto, escala);
        continue;
      }

      break; // já no mínimo de tudo; overflow:hidden evita quebrar o layout
    }

    return linhasForaDoPoster();
  }

  // Passando de ~30 pessoas nem no tamanho mínimo cabe tudo no 9:16, e o
  // overflow:hidden some com quem sobrou. Melhor avisar do que deixar alguém
  // de fora do print sem ninguém perceber.
  function linhasForaDoPoster(){
    const caixa = posterRows.getBoundingClientRect();
    let fora = 0;
    for (const linha of posterRows.children){
      const r = linha.getBoundingClientRect();
      if (r.top < caixa.top - 0.5 || r.bottom > caixa.bottom + 0.5) fora++;
    }
    return fora;
  }

  function gerarBrasasDoPoster(qtd = 16){
    posterEmbersEl.innerHTML = '';
    for (let i = 0; i < qtd; i++){
      const d = document.createElement('div');
      d.className = 'poster-ember';
      const size = 1.5 + Math.random() * 3;
      const top = 60 + Math.random() * 40;
      const left = Math.random() * 100;
      d.style.top = top + '%';
      d.style.left = left + '%';
      d.style.width = size + 'px';
      d.style.height = size + 'px';
      d.style.opacity = (0.18 + Math.random() * 0.32).toFixed(2);
      d.style.animationDuration = (5 + Math.random() * 6).toFixed(1) + 's';
      d.style.animationDelay = (Math.random() * 5).toFixed(1) + 's';
      posterEmbersEl.appendChild(d);
    }
  }

  function renderPoster(){
    // Liga/desliga a vinheta e o fade escuro conforme tem ou não gente na lista
    posterWrap.classList.toggle('tem-gente', pessoas.length > 0);

    const linhas = [];
    ORDEM_TIPOS.forEach(grupo => {
      pessoas
        .filter(p => p.tipo === grupo.key)
        .sort((a, b) => (parseInt(b.nivel) || 0) - (parseInt(a.nivel) || 0))
        .forEach(p => linhas.push(p));
    });

    posterRows.innerHTML = linhas.map(p => {
      const icons = TIPO_ICONS[p.tipo];
      const nivelTxt = p.tipo === 'superfã'
        ? 'se tornou superfã'
        : (p.nivel ? `atingiu o nível ${p.nivel} de ${p.tipo}` : `é ${p.tipo}`);
      return `
        <div class="poster-row ${p.tipo}">
          <span class="side-icon">${ICONS[icons.left]}</span>
          <div class="info">
            <span class="nome">${esc(p.nome)}</span>
            <span class="texto">${nivelTxt}</span>
          </div>
          <span class="side-icon">${ICONS[icons.right]}</span>
        </div>`;
    }).join('');

    // Só dá pra medir o espaço depois que as linhas já estão no DOM.
    const fora = ajustarPosterParaCaber(linhas.length);
    posterAviso.hidden = !fora;
    if (fora){
      posterAviso.textContent = `⚠️ ${fora} ${fora === 1 ? 'pessoa não cabe' : 'pessoas não cabem'} no poster 9:16 e ${fora === 1 ? 'ficou' : 'ficaram'} de fora da imagem. Tire ${fora === 1 ? 'alguém' : 'algumas pessoas'} da lista pra caberem todos.`;
    }
  }

  function arredondarCanvas(canvasOriginal, raioPx){
    const out = document.createElement('canvas');
    out.width = canvasOriginal.width;
    out.height = canvasOriginal.height;
    const ctx = out.getContext('2d');

    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, out.width, out.height);

    ctx.save();
    ctx.beginPath();
    ctx.moveTo(raioPx, 0);
    ctx.arcTo(out.width, 0, out.width, out.height, raioPx);
    ctx.arcTo(out.width, out.height, 0, out.height, raioPx);
    ctx.arcTo(0, out.height, 0, 0, raioPx);
    ctx.arcTo(0, 0, out.width, 0, raioPx);
    ctx.closePath();
    ctx.clip();
    ctx.drawImage(canvasOriginal, 0, 0);
    ctx.restore();

    return out;
  }

  function gerarImagemFinal(){
    downloadImgBtn.textContent = 'Gerando...';
    renderPoster(); // recalcula o encaixe com as fontes/foto já carregadas
    const larguraAlvo = 1080;
    const escala = larguraAlvo / posterWrap.clientWidth;
    const raioCss = 18;
    // imageTimeout: 0 = sem timeout artificial; deixa o html2canvas esperar
    // o quanto for preciso pra garantir que a imagem de fundo (já decodificada
    // em alta resolução acima) seja capturada corretamente.
    html2canvas(posterWrap, {
      backgroundColor: '#000000',
      scale: escala,
      useCORS: true,
      imageTimeout: 0,
      // O convite "escolha o fundo" é instrução de tela, não parte do story:
      // sem isto ele sairia escrito na imagem que o streamer posta. Fica aqui
      // em vez de esconder e mostrar o elemento, pra não piscar na tela dele.
      ignoreElements: el => el.id === 'fundoVazio',
    }).then(canvas => {
      const canvasFinal = arredondarCanvas(canvas, raioCss * escala);
      return entregarImagem(canvasFinal);
    }).then(() => {
      downloadImgBtn.textContent = '⬇️ Baixar imagem (PNG)';
    }).catch(() => {
      downloadImgBtn.textContent = '⬇️ Baixar imagem (PNG)';
      alert('Não consegui gerar a imagem. Tenta de novo.');
    });
  }

  // ---------- Entregar a imagem pronta ----------
  // No iPhone/iPad o Safari IGNORA o atributo `download` do link: o clique
  // simplesmente não salva nada, sem erro nenhum. Por isso aqui existem três
  // caminhos, do melhor pro que sempre funciona.
  const imagemPronta = document.getElementById('imagemPronta');
  const imagemProntaImg = document.getElementById('imagemProntaImg');
  const imagemProntaDica = document.getElementById('imagemProntaDica');
  document.getElementById('imagemProntaFechar')
    .addEventListener('click', () => imagemPronta.classList.remove('show'));

  function canvasParaBlob(canvas) {
    return new Promise(resolve => {
      if (canvas.toBlob) canvas.toBlob(resolve, 'image/png');
      else resolve(null);
    });
  }

  const ehToque = matchMedia('(pointer: coarse)').matches || navigator.maxTouchPoints > 1;

  function mostrarImagemNaTela(canvas, dica) {
    imagemProntaImg.src = canvas.toDataURL('image/png');
    imagemProntaDica.textContent = dica;
    imagemPronta.classList.add('show');
    imagemPronta.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  async function entregarImagem(canvas) {
    // 1) Menu nativo de compartilhar (iOS 15+, Android). É o melhor caminho no
    //    celular/tablet: dá pra "Salvar em Fotos" ou mandar direto pro story.
    try {
      const blob = await canvasParaBlob(canvas);
      if (blob && navigator.canShare) {
        const arquivo = new File([blob], 'tropa.png', { type: 'image/png' });
        if (navigator.canShare({ files: [arquivo] })) {
          await navigator.share({ files: [arquivo], title: 'Mural da Tropa' });
          showToast('Imagem enviada ✓');
          return;
        }
      }
    } catch (e) {
      // usuário fechou o menu: não é erro, e não precisa de plano B
      if (e && e.name === 'AbortError') return;
      // qualquer outra falha cai pros caminhos abaixo
    }

    // 2) Download normal (computador).
    if (!ehToque) {
      try {
        const link = document.createElement('a');
        link.download = 'tropa.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
        showToast('Imagem gerada ✓');
        return;
      } catch (e) { /* cai pro plano C */ }
    }

    // 3) Mostra a imagem na tela pra salvar segurando o dedo em cima.
    //    É o que sempre funciona no iPad, mesmo sem menu de compartilhar.
    mostrarImagemNaTela(canvas, ehToque
      ? '👆 Segure o dedo na imagem e escolha "Salvar em Fotos" (ou "Adicionar às Fotos").'
      : 'Clique com o botão direito na imagem e escolha "Salvar imagem como...".');
  }

  downloadImgBtn.addEventListener('click', () => {
    if (!pessoas.length){
      alert('Adicione pelo menos uma pessoa na lista primeiro.');
      return;
    }
    // Garante que a foto em alta resolução já foi decodificada antes de
    // capturar; se o usuário clicar muito rápido (raro, mas possível),
    // espera até 1.5s por ela em vez de arriscar capturar uma versão pior.
    if (fotoPronta){
      gerarImagemFinal();
    } else {
      let tentativas = 0;
      const espera = setInterval(() => {
        tentativas++;
        if (fotoPronta || tentativas > 15){
          clearInterval(espera);
          gerarImagemFinal();
        }
      }, 100);
    }
  });

  renderTipoOptions();
  renderBiblioteca();
  gerarBrasasDoPoster();
  render();

  // As fontes (Bungee) chegam DEPOIS do primeiro render e mudam a altura das
  // linhas — sem refazer a conta, o encaixe fica calculado em cima da fonte
  // de fallback e sobra/falta espaço no poster.
  if (document.fonts?.ready) document.fonts.ready.then(renderPoster);
  window.addEventListener('resize', renderPoster);

</script>
