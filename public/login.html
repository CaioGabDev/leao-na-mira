<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entrar — TEM LEÃO NA MIRA! 🎯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  /* ===========================================================================
     ENTRADA DO ADMINISTRADOR DA CAMPANHA.
     -------------------------------------------------------------------------
     Só administrador entra (o servidor recusa as outras contas). O público
     não passa por aqui: o ranking é aberto em /mira.html.

     Não usa /assets/theme.css: o gate só libera esta página antes do login,
     então CSS externo seria redirecionado e a tela cairia pelada.
     =========================================================================== */
  :root {
    --preto:    #05070c;
    --fundo-2:  #080b13;
    --painel:   #0c111c;
    --painel-2: #0a0e18;
    --linha:    #1a2333;
    --linha-luz:#232f44;

    --ink:      #e9eefb;
    --ink-dim:  #94a3bd;
    --ink-fraco:#5d6b85;

    --azul:     #3b82f6;
    --azul-luz: #7aa7ff;
    --azul-esc: #1d4ed8;

    --r-sm: 10px; --r-md: 14px; --r-lg: 20px; --r-xl: 26px; --r-pill: 999px;
  }
  * { box-sizing: border-box; }
  html { height: 100%; background: var(--preto); }
  body {
    margin: 0; min-height: 100%;
    font-family: 'Inter', system-ui, sans-serif;
    color: var(--ink); -webkit-font-smoothing: antialiased;
    display: grid; place-items: center; padding: 24px;
  }

  /* fundo: malha fina + dois focos de luz azul, presos na viewport */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: -2; pointer-events: none;
    background:
      radial-gradient(900px 560px at 15% -10%, rgba(59,130,246,.16), transparent 62%),
      radial-gradient(760px 620px at 100% 8%,  rgba(29,78,216,.13),  transparent 58%),
      radial-gradient(600px 400px at 50% 120%, rgba(122,167,255,.07), transparent 60%);
  }
  body::after {
    content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background-image:
      linear-gradient(rgba(122,167,255,.045) 1px, transparent 1px),
      linear-gradient(90deg, rgba(122,167,255,.045) 1px, transparent 1px);
    background-size: 54px 54px;
    /* a malha some nas bordas pra não virar papel quadriculado */
    -webkit-mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 20%, transparent 78%);
            mask-image: radial-gradient(ellipse 80% 70% at 50% 40%, #000 20%, transparent 78%);
  }

  /* ---------- cartão ---------- */
  .caixa {
    width: 100%; max-width: 900px;
    display: grid; grid-template-columns: 1.05fr 1fr;
    border-radius: var(--r-xl); overflow: hidden;
    background: linear-gradient(170deg, var(--painel), var(--painel-2));
    border: 1px solid var(--linha);
    box-shadow:
      0 50px 110px -45px #000,
      0 0 0 1px rgba(122,167,255,.05),
      inset 0 1px 0 rgba(122,167,255,.09);
  }

  /* ---------- lado do produto ---------- */
  .lado-produto {
    position: relative; overflow: hidden;
    padding: 46px 40px;
    border-right: 1px solid var(--linha);
    background:
      radial-gradient(520px 340px at 0% 0%, rgba(59,130,246,.14), transparent 64%),
      linear-gradient(180deg, rgba(122,167,255,.035), transparent 50%);
    display: flex; flex-direction: column;
  }
  /* risco de luz correndo no topo — o detalhe que dá vida sem poluir */
  .lado-produto::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, var(--azul-luz), transparent);
    opacity: .55;
    animation: correr 7s ease-in-out infinite;
  }
  @keyframes correr {
    0%, 100% { transform: translateX(-60%); }
    50%      { transform: translateX(60%); }
  }
  @media (prefers-reduced-motion: reduce) { .lado-produto::before { animation: none; } }

  .selo {
    width: 46px; height: 46px; border-radius: 13px;
    display: grid; place-items: center;
    background: linear-gradient(155deg, var(--azul-luz), var(--azul-esc));
    box-shadow: 0 10px 26px -10px rgba(59,130,246,.85), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .selo svg { width: 22px; height: 22px; display: block; }

  h1 {
    font-size: 30px; font-weight: 800; letter-spacing: -.025em;
    margin: 24px 0 10px; line-height: 1.08;
    background: linear-gradient(180deg, #ffffff, #b9cdf5 78%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .lema { color: var(--ink-dim); font-size: 14.5px; line-height: 1.55; margin: 0; font-weight: 400; }

  .itens { list-style: none; margin: 30px 0 0; padding: 0; }
  .itens li {
    display: flex; gap: 11px; align-items: flex-start;
    font-size: 13.5px; color: var(--ink-dim); line-height: 1.45; font-weight: 450;
  }
  .itens li + li { margin-top: 13px; }
  .itens .tique {
    flex: none; width: 18px; height: 18px; margin-top: 1px; border-radius: 6px;
    display: grid; place-items: center;
    background: rgba(59,130,246,.14); border: 1px solid rgba(122,167,255,.26);
  }
  .itens .tique svg { width: 10px; height: 10px; display: block; color: var(--azul-luz); }

  .rodape-produto {
    margin-top: auto; padding-top: 30px;
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--ink-fraco); font-weight: 600;
  }
  .pontinho {
    width: 6px; height: 6px; border-radius: 50%; background: #34d399;
    box-shadow: 0 0 0 3px rgba(52,211,153,.14);
  }

  /* ---------- lado do formulário ---------- */
  .lado-form { padding: 46px 40px; display: flex; flex-direction: column; justify-content: center; }
  h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; margin: 0 0 5px; }
  .abre { color: var(--ink-fraco); font-size: 13.5px; margin: 0 0 28px; font-weight: 400; }

  .campo + .campo { margin-top: 16px; }
  label {
    display: block; font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    font-weight: 600; color: var(--ink-fraco); margin: 0 0 8px;
  }
  .com-botao { position: relative; }
  input {
    width: 100%; padding: 13px 15px; border-radius: var(--r-sm);
    border: 1px solid var(--linha-luz); background: #070b13;
    font-family: 'Inter', system-ui, sans-serif; font-weight: 500; font-size: 14.5px;
    color: var(--ink); outline: none;
    transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
  }
  .com-botao input { padding-right: 50px; }
  input::placeholder { color: #465468; font-weight: 400; }
  input:focus {
    border-color: var(--azul); background: #080d17;
    box-shadow: 0 0 0 3.5px rgba(59,130,246,.17);
  }

  .olho {
    position: absolute; right: 5px; top: 50%; transform: translateY(-50%);
    background: none; border: none; cursor: pointer; padding: 8px;
    border-radius: 8px; color: var(--ink-fraco); display: grid; place-items: center;
    transition: color .15s ease, background .15s ease;
  }
  .olho svg { width: 17px; height: 17px; display: block; }
  .olho:hover { color: var(--azul-luz); background: rgba(59,130,246,.1); }

  .caps {
    display: none; margin-top: 9px; font-size: 12px; color: #fbbf24; font-weight: 500;
    align-items: center; gap: 6px;
  }
  .caps.ver { display: flex; }

  .entrar {
    width: 100%; margin-top: 28px; cursor: pointer; position: relative;
    background: linear-gradient(180deg, var(--azul-luz) -10%, var(--azul) 45%, var(--azul-esc));
    color: #fff; font-family: 'Inter', system-ui, sans-serif;
    font-weight: 600; font-size: 14.5px; letter-spacing: .01em;
    padding: 14px 18px; border-radius: var(--r-sm); border: none;
    box-shadow: 0 12px 28px -14px rgba(59,130,246,.95), inset 0 1px 0 rgba(255,255,255,.22);
    transition: filter .16s ease, transform .1s ease, box-shadow .16s ease;
  }
  .entrar:hover { filter: brightness(1.08); box-shadow: 0 16px 34px -14px rgba(59,130,246,1); }
  .entrar:active { transform: translateY(1px); }
  .entrar:disabled { opacity: .5; cursor: default; filter: none; box-shadow: none; }

  .erro {
    display: none; margin-top: 18px;
    background: rgba(127,29,29,.26); border: 1px solid rgba(248,113,113,.3);
    border-radius: var(--r-sm); padding: 11px 14px;
    font-size: 13px; color: #fca5a5; text-align: center; font-weight: 450;
  }
  .erro.ver { display: block; }


  :where(input, button, a):focus-visible { outline: 2px solid var(--azul-luz); outline-offset: 2px; }

  /* No celular o lado do produto vira um cabeçalho curto: a lista de itens
     empurraria o formulário pra fora da primeira tela. */
  @media (max-width: 760px) {
    .caixa { grid-template-columns: 1fr; max-width: 430px; }
    .lado-produto {
      border-right: none; border-bottom: 1px solid var(--linha);
      padding: 30px 26px 26px;
    }
    .itens, .rodape-produto { display: none; }
    h1 { font-size: 25px; margin: 18px 0 8px; }
    .lado-form { padding: 30px 26px 34px; }
  }
</style>
</head>
<body>

<main class="caixa">
  <section class="lado-produto">
    <div class="selo" aria-hidden="true">
      <!-- barrinhas de ranking: é o que o produto faz -->
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round">
        <path d="M5 20V12M12 20V5M19 20v-6"/>
      </svg>
    </div>

    <h1>TEM LEÃO NA MIRA! 🎯</h1>
    <p class="lema">Área do administrador da campanha</p>

    <ul class="itens">
      <li>
        <span class="tique"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.3 4.6 9 10 3.3"/></svg></span>
        <span>Horas de live e diamantes contados direto do TikTok</span>
      </li>
      <li>
        <span class="tique"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.3 4.6 9 10 3.3"/></svg></span>
        <span>Cadastro das indicações de cada sniper</span>
      </li>
      <li>
        <span class="tique"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.3 4.6 9 10 3.3"/></svg></span>
        <span>Status da conexão da live de cada sniper</span>
      </li>
    </ul>

    <div class="rodape-produto">
      <span class="pontinho" aria-hidden="true"></span>
      <span>Sistema no ar</span>
    </div>
  </section>

  <section class="lado-form">
    <h2>Entrar</h2>
    <p class="abre">Acesso só para administradores.</p>

    <form id="formLogin" novalidate>
      <div class="campo">
        <label for="usuario">Usuário</label>
        <input type="text" id="usuario" autocomplete="username" placeholder="seu usuário"
               autocapitalize="none" spellcheck="false" required>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <div class="com-botao">
          <input type="password" id="senha" autocomplete="current-password" placeholder="••••••••" required>
          <button type="button" class="olho" id="olho" aria-label="Mostrar a senha" title="Mostrar a senha">
            <svg id="olhoIcone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
        <span class="caps" id="caps">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4 4 12h4v5h8v-5h4Z"/></svg>
          Caps Lock está ligado
        </span>
      </div>

      <div class="erro" id="erro" role="alert"></div>
      <button type="submit" class="entrar" id="entrar">Entrar</button>
    </form>

  </section>
</main>

<script>
  const $ = id => document.getElementById(id);

  // mostrar/esconder a senha
  const senha = $('senha');
  const OLHO_ABERTO = '<path d="M2 12s3.8-7 10-7 10 7 10 7-3.8 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
  const OLHO_CORTADO = '<path d="M2 12s3.8-7 10-7c2 0 3.7.7 5.1 1.6M22 12s-3.8 7-10 7c-2 0-3.7-.7-5.1-1.6"/><path d="m3 3 18 18"/>';
  $('olho').addEventListener('click', () => {
    const vendo = senha.type === 'text';
    senha.type = vendo ? 'password' : 'text';
    $('olhoIcone').innerHTML = vendo ? OLHO_ABERTO : OLHO_CORTADO;
    $('olho').setAttribute('aria-label', vendo ? 'Mostrar a senha' : 'Esconder a senha');
    senha.focus();
  });

  // Caps Lock: com a senha escondida, errar por causa disso é invisível — a
  // pessoa jura que digitou certo e o servidor só diz "inválido".
  const caps = $('caps');
  const olharCaps = e => {
    if (typeof e.getModifierState !== 'function') return;
    caps.classList.toggle('ver', e.getModifierState('CapsLock'));
  };
  senha.addEventListener('keydown', olharCaps);
  senha.addEventListener('keyup', olharCaps);
  senha.addEventListener('blur', () => caps.classList.remove('ver'));

  const erro = $('erro');
  const mostrarErro = texto => { erro.textContent = texto; erro.classList.add('ver'); };

  $('formLogin').addEventListener('submit', async e => {
    e.preventDefault();
    erro.classList.remove('ver');

    const usuario = $('usuario').value.trim();
    if (!usuario || !senha.value) return mostrarErro('Preencha usuário e senha.');

    const botao = $('entrar');
    botao.disabled = true;
    botao.textContent = 'Entrando...';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: usuario, password: senha.value })
      });
      if (res.ok) {
        const params = new URLSearchParams(location.search);
        // Quem pediu uma página específica vai pra ela — mas só se for daqui
        // de dentro: um ?next=https://... levaria quem acabou de logar pra
        // outro site. Fora isso, quem manda é o servidor.
        const dados = await res.json().catch(() => ({}));
        const pedido = params.get('next') || '';
        // "/x" é daqui; "//site" e "/\site" o navegador lê como outro domínio
        const interno = /^\/(?![\/\\])/.test(pedido);
        location.href = (interno && pedido) || dados.destino || '/mira-admin.html';
        return;
      }
      const dados = await res.json().catch(() => ({}));
      mostrarErro(dados.error || 'Usuário ou senha inválidos.');
    } catch (e) {
      mostrarErro('Erro ao conectar com o servidor.');
    } finally {
      botao.disabled = false;
      botao.textContent = 'Entrar';
    }
  });

  $('usuario').focus();
</script>
</body>
</html>
