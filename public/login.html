<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login — Ranking da Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* Esta página NÃO usa /assets/theme.css de propósito: o gate de autenticação
     do server só libera /login.html e /api/login, então qualquer CSS externo
     seria redirecionado e a tela cairia sem estilo. Os tokens abaixo são os
     mesmos do theme.css — se mudar lá, mude aqui. */
  :root {
    --bg: #0a0807; --card: #150f0b; --card-2: #0f0b08; --line: #2b2119; --line-soft: #201810;
    --ink: #f3e9dc; --ink-dim: #9c8b7d; --ink-faint: #5a4c40;
    --gold: #ffb03a; --ember1: #ff7a1a; --ember2: #ff2d2d;
    --grad-fire: linear-gradient(180deg, var(--gold), var(--ember1));
    --r-sm: 10px; --r-md: 14px; --r-lg: 18px; --r-xl: 22px; --r-pill: 999px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; min-height: 100%;
    background:
      radial-gradient(700px 420px at 12% -6%, rgba(255,122,26,.14), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(255,45,45,.08), transparent 55%),
      var(--bg);
    color: var(--ink); font-family: 'Rajdhani', sans-serif; font-weight: 600;
    -webkit-font-smoothing: antialiased;
  }
  body { display: grid; place-items: center; padding: 24px; min-height: 100vh; }

  .box {
    width: 100%; max-width: 380px;
    background: linear-gradient(168deg, var(--card), var(--card-2));
    border: 1px solid var(--line); border-radius: var(--r-xl);
    padding: 34px 30px 30px;
    box-shadow: 0 30px 70px -30px #000;
  }

  .mark {
    width: 52px; height: 52px; margin: 0 auto 18px;
    display: grid; place-items: center; font-size: 24px;
    border-radius: var(--r-md);
    background: linear-gradient(160deg, rgba(255,176,58,.22), rgba(255,45,45,.10));
    border: 1px solid rgba(255,176,58,.32);
    box-shadow: inset 0 0 22px -6px rgba(255,122,26,.7);
  }

  h1 {
    font-family: 'Bungee', sans-serif; font-weight: 400; font-size: 23px;
    text-align: center; margin: 0 0 6px; line-height: 1.15;
    background: linear-gradient(180deg, #ffe9b0 0%, var(--gold) 30%, var(--ember1) 65%, #a3230f 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  p.sub { text-align: center; color: var(--ink-faint); font-size: 13px; margin: 0 0 26px; }

  .field + .field { margin-top: 16px; }
  label {
    display: block; font-size: 10.5px; letter-spacing: .16em; text-transform: uppercase;
    font-weight: 700; color: var(--ink-faint); margin: 0 0 7px;
  }
  input {
    width: 100%; padding: 12px 14px; border-radius: var(--r-sm);
    border: 1.5px solid var(--line); background: #0d0907;
    font-family: 'Rajdhani', sans-serif; font-weight: 600; font-size: 15px;
    color: var(--ink); outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
  }
  input::placeholder { color: var(--ink-faint); }
  input:focus { border-color: var(--gold); box-shadow: 0 0 0 3px rgba(255,176,58,.16); }

  button {
    width: 100%; margin-top: 26px; cursor: pointer;
    background: var(--grad-fire); color: #2a1400;
    font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 14px;
    letter-spacing: .04em; text-transform: uppercase;
    padding: 13px 16px; border-radius: var(--r-pill); border: none;
    box-shadow: 0 10px 24px -12px rgba(255,122,26,.9);
    transition: filter .15s ease, transform .1s ease;
  }
  button:hover { filter: brightness(1.06); }
  button:active { transform: translateY(1px); }
  button:disabled { opacity: .55; cursor: default; filter: none; }

  .error {
    display: none; margin-top: 16px;
    background: rgba(90,20,20,.3); border: 1px solid rgba(255,70,70,.32);
    border-radius: var(--r-sm); padding: 10px 13px;
    font-size: 13px; color: #ffb3b3; text-align: center;
  }
  .error.show { display: block; }

  .foot {
    margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line-soft);
    text-align: center; font-size: 11px; letter-spacing: .12em; text-transform: uppercase;
    color: var(--ink-faint);
  }

  :where(input, button):focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
</style>
</head>
<body>

<div class="box">
  <div class="mark">🔥</div>
  <h1>Ranking da Live</h1>
  <p class="sub">Faça login pra acessar</p>

  <form id="loginForm">
    <div class="field">
      <label for="username">Usuário</label>
      <input type="text" id="username" autocomplete="username" placeholder="seu usuário" required>
    </div>
    <div class="field">
      <label for="password">Senha</label>
      <input type="password" id="password" autocomplete="current-password" placeholder="••••••••" required>
    </div>
    <div class="error" id="errorMsg"></div>
    <button type="submit" id="submitBtn">Entrar</button>
  </form>

  <div class="foot">Acesso restrito</div>
</div>

<script>
  const form = document.getElementById('loginForm');
  const errorMsg = document.getElementById('errorMsg');
  const submitBtn = document.getElementById('submitBtn');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    errorMsg.classList.remove('show');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Entrando...';
    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value
        })
      });
      if (res.ok) {
        const params = new URLSearchParams(location.search);
        location.href = params.get('next') || '/';
        return;
      }
      const data = await res.json().catch(() => ({}));
      errorMsg.textContent = data.error || 'Usuário ou senha inválidos.';
      errorMsg.classList.add('show');
    } catch (e) {
      errorMsg.textContent = 'Erro ao conectar com o servidor.';
      errorMsg.classList.add('show');
    } finally {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Entrar';
    }
  });
</script>
</body>
</html>
