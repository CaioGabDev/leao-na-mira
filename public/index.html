<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking da Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0605;
    --bg2: #150b08;
    --ember1: #ff7a1a;
    --ember2: #ff2d2d;
    --gold: #ffb03a;
    --text: #f2e6da;
    --muted: #9c8b7d;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    height: 100%;
    background: radial-gradient(ellipse at 50% -10%, #2a1208 0%, var(--bg) 55%, #000 100%);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    overflow-x: hidden;
  }

  canvas#embers {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    z-index: 1;
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 18px 60px;
  }

  header {
    text-align: center;
    margin-bottom: 36px;
  }

  .eyebrow {
    letter-spacing: 6px;
    font-size: 12px;
    color: var(--gold);
    font-weight: 700;
    text-transform: uppercase;
  }

  h1 {
    font-family: 'Anton', sans-serif;
    font-size: clamp(38px, 10vw, 64px);
    line-height: 0.95;
    margin: 6px 0 0;
    letter-spacing: 1px;
    text-transform: uppercase;
    background: linear-gradient(180deg, #ffe9b0 0%, var(--gold) 25%, var(--ember1) 55%, var(--ember2) 85%, #7a0f0f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-shadow: 0 0 30px rgba(255, 90, 20, 0.35);
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.5));
  }

  .sub {
    margin-top: 8px;
    color: var(--muted);
    font-size: 14px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .list {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .row {
    display: grid;
    grid-template-columns: 40px 1fr auto;
    align-items: center;
    gap: 12px;
    background: linear-gradient(180deg, rgba(40,18,10,0.9), rgba(15,7,5,0.9));
    border: 1px solid rgba(255,122,26,0.25);
    border-radius: 999px;
    padding: 10px 18px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset, 0 6px 18px rgba(0,0,0,0.45);
    animation: fadeIn 0.4s ease;
  }

  .row.top1 { border-color: rgba(255,176,58,0.75); box-shadow: 0 0 22px rgba(255,140,20,0.35), 0 6px 18px rgba(0,0,0,0.45); }
  .row.top2 { border-color: rgba(255,122,26,0.55); }
  .row.top3 { border-color: rgba(255,90,60,0.45); }

  .rank {
    font-family: 'Anton', sans-serif;
    font-size: 20px;
    color: var(--muted);
    text-align: center;
  }
  .top1 .rank { color: var(--gold); text-shadow: 0 0 10px rgba(255,176,58,0.8); }
  .top2 .rank { color: #ffcf9e; }
  .top3 .rank { color: #ff9d6a; }

  .name {
    display: flex;
    align-items: center;
    gap: 8px;
    font-weight: 700;
    font-size: 17px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .crown { font-size: 15px; }

  .stats {
    display: flex;
    gap: 14px;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
  }

  .stat {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .stat .val { color: var(--text); font-weight: 700; }

  .toolbar {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
  }

  .toolbar-row2 {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
  }

  .search-input {
    flex: 1;
    min-width: 140px;
    background: rgba(20, 10, 8, 0.6);
    border: 1px solid rgba(255,122,26,0.3);
    border-radius: 999px;
    padding: 10px 16px;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }
  .search-input::placeholder { color: var(--muted); }
  .search-input:focus {
    border-color: var(--gold);
    box-shadow: 0 0 10px rgba(255,176,58,0.3);
  }

  .sort-btn {
    background: rgba(20, 10, 8, 0.6);
    border: 1px solid rgba(255,122,26,0.3);
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.5px;
    padding: 10px 16px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s ease;
  }
  .sort-btn:hover { border-color: var(--gold); color: var(--text); }
  .sort-btn.active {
    background: linear-gradient(180deg, var(--gold), var(--ember1));
    color: #2a1400;
    border-color: transparent;
    box-shadow: 0 0 12px rgba(255,140,20,0.4);
  }

  .empty {
    text-align: center;
    color: var(--muted);
    padding: 40px 0;
    font-size: 15px;
    letter-spacing: 1px;
  }

  .status-banner {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(90, 20, 20, 0.4);
    border: 1px solid rgba(255, 70, 70, 0.4);
    border-radius: 999px;
    padding: 8px 16px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: #ff9a9a;
    margin: 0 auto 24px;
    width: fit-content;
  }
  .status-banner.show { display: flex; }
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #ff3b3b;
    box-shadow: 0 0 8px #ff3b3b;
  }

  .actions-bar {
    display: flex;
    justify-content: center;
    margin-top: 28px;
  }

  .load-more-btn {
    display: block;
    margin: 20px auto 0;
    background: rgba(20, 10, 8, 0.6);
    border: 1px solid rgba(255,122,26,0.3);
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 1px;
    text-transform: uppercase;
    padding: 10px 24px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .load-more-btn:hover {
    border-color: var(--gold);
    color: var(--text);
    box-shadow: 0 0 12px rgba(255,176,58,0.25);
  }

  .reset-btn {
    background: transparent;
    border: 1px solid rgba(255,122,26,0.35);
    color: var(--muted);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 700;
    letter-spacing: 1px;
    font-size: 12px;
    text-transform: uppercase;
    padding: 8px 18px;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .reset-btn:hover {
    color: var(--ember2);
    border-color: var(--ember2);
    box-shadow: 0 0 12px rgba(255,45,45,0.3);
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<canvas id="embers"></canvas>

<div class="wrap">
  <header>
    <div class="eyebrow">Ao vivo agora</div>
    <h1>Ranking da Live</h1>
    <div class="sub">Quem mais tá na treta hoje 🔥</div>
  </header>

  <div class="status-banner" id="statusBanner">
    <span class="status-dot"></span>
    <span>Live offline — mostrando resultados da última live</span>
  </div>

  <div class="toolbar">
    <input type="text" class="search-input" id="searchInput" placeholder="Buscar usuário...">
  </div>

  <div class="toolbar-row2">
    <div style="display:flex; gap:10px;">
      <button class="sort-btn active" id="sortLikes" data-sort="likes">❤️ Likes</button>
      <button class="sort-btn" id="sortGifts" data-sort="gifts_value">🎁 Presentes</button>
    </div>
    <button class="reset-btn" id="resetBtn">Resetar dados</button>
  </div>

  <div class="list" id="ranking">
    <div class="empty">Esperando a live começar...</div>
  </div>

  <button class="load-more-btn" id="loadMoreBtn" style="display:none;">Carregar mais</button>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const container = document.getElementById('ranking');
  const statusBanner = document.getElementById('statusBanner');
  const resetBtn = document.getElementById('resetBtn');
  const searchInput = document.getElementById('searchInput');
  const sortButtons = document.querySelectorAll('.sort-btn');
  const loadMoreBtn = document.getElementById('loadMoreBtn');

  let latestData = [];
  let currentSort = 'likes';
  let currentSearch = '';
  const PAGE_SIZE = 15;
  let visibleCount = PAGE_SIZE;

  sortButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      currentSort = btn.dataset.sort;
      sortButtons.forEach(b => b.classList.toggle('active', b === btn));
      visibleCount = PAGE_SIZE;
      render();
    });
  });

  searchInput.addEventListener('input', () => {
    currentSearch = searchInput.value.trim().toLowerCase();
    visibleCount = PAGE_SIZE;
    render();
  });

  loadMoreBtn.addEventListener('click', () => {
    visibleCount += PAGE_SIZE;
    render();
  });

  socket.on('live_status', ({ online }) => {
    statusBanner.classList.toggle('show', !online);
  });

  resetBtn.addEventListener('click', async () => {
    const confirmado = confirm('Tem certeza que quer resetar TODOS os dados salvos? Essa ação não pode ser desfeita.');
    if (!confirmado) return;
    resetBtn.disabled = true;
    resetBtn.textContent = 'Resetando...';
    try {
      await fetch('/api/reset', { method: 'POST' });
    } catch (e) {
      alert('Erro ao resetar. Verifica se o servidor está rodando.');
    } finally {
      resetBtn.disabled = false;
      resetBtn.textContent = 'Resetar dados';
    }
  });

  socket.on('ranking', data => {
    latestData = data;
    render();
  });

  function render() {
    let list = latestData.filter(u => {
      if (!currentSearch) return true;
      const alvo = `${u.nickname || ''} ${u.uniqueId || ''}`.toLowerCase();
      return alvo.includes(currentSearch);
    });

    list = [...list].sort((a, b) => (b[currentSort] || 0) - (a[currentSort] || 0));

    if (!list.length) {
      container.innerHTML = `<div class="empty">${currentSearch ? 'Nenhum usuário encontrado.' : 'Esperando a live começar...'}</div>`;
      loadMoreBtn.style.display = 'none';
      return;
    }

    const visibleList = list.slice(0, visibleCount);

    container.innerHTML = visibleList.map((u, i) => {
      const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
      const crown = i === 0 ? '👑' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
      return `
        <div class="row ${rankClass}">
          <div class="rank">${i + 1}</div>
          <div class="name">${crown ? `<span class="crown">${crown}</span>` : ''}${u.nickname || u.uniqueId}</div>
          <div class="stats">
            <div class="stat">❤️ <span class="val">${u.likes}</span></div>
            <div class="stat">🎁 <span class="val">${u.gifts_value}</span></div>
          </div>
        </div>
      `;
    }).join('');

    loadMoreBtn.style.display = list.length > visibleCount ? 'block' : 'none';
  }

  // Partículas de fogo subindo (canvas leve, sem libs)
  const canvas = document.getElementById('embers');
  const ctx = canvas.getContext('2d');
  let w, h;
  function resize() {
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  const particles = Array.from({ length: 45 }, () => spawn());

  function spawn(initial) {
    return {
      x: Math.random() * w,
      y: initial ? Math.random() * h : h + 20,
      r: 1 + Math.random() * 2.2,
      speed: 0.4 + Math.random() * 1.1,
      drift: (Math.random() - 0.5) * 0.6,
      life: Math.random(),
      flicker: Math.random() * 0.02 + 0.01
    };
  }
  particles.forEach(p => Object.assign(p, spawn(true)));

  function tick() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.y -= p.speed;
      p.x += p.drift;
      p.life += p.flicker;
      const alpha = 0.5 + Math.sin(p.life * 10) * 0.3;
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      grad.addColorStop(0, `rgba(255, 170, 60, ${Math.max(alpha, 0)})`);
      grad.addColorStop(1, 'rgba(255, 60, 20, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2);
      ctx.fill();

      if (p.y < -20 || p.x < -20 || p.x > w + 20) {
        Object.assign(p, spawn(false));
      }
    });
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
