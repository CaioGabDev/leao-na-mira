<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking da Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0605;
    --ember1: #ff7a1a;
    --ember2: #ff2d2d;
    --gold: #ffb03a;
    --text: #f2e6da;
    --muted: #9c8b7d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background: radial-gradient(ellipse at 50% -10%, #2a1208 0%, var(--bg) 55%, #000 100%);
    color: var(--text); font-family: 'Rajdhani', sans-serif; overflow-x: hidden;
  }
  canvas#embers, canvas#confetti {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
  }
  canvas#confetti { z-index: 50; }
  .wrap { position: relative; z-index: 1; max-width: 640px; margin: 0 auto; padding: 40px 18px 60px; }
  header { text-align: center; margin-bottom: 24px; }
  .eyebrow { letter-spacing: 6px; font-size: 12px; color: var(--gold); font-weight: 700; text-transform: uppercase; }
  h1 {
    font-family: 'Anton', sans-serif; font-size: clamp(38px, 10vw, 64px); line-height: 0.95;
    margin: 6px 0 0; letter-spacing: 1px; text-transform: uppercase;
    background: linear-gradient(180deg, #ffe9b0 0%, var(--gold) 25%, var(--ember1) 55%, var(--ember2) 85%, #7a0f0f 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
    text-shadow: 0 0 30px rgba(255, 90, 20, 0.35);
    filter: drop-shadow(0 4px 0 rgba(0,0,0,0.5));
  }
  .sub { margin-top: 8px; color: var(--muted); font-size: 14px; font-weight: 600; letter-spacing: 1px; }

  .viewer-badge {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,122,26,0.12); border: 1px solid rgba(255,122,26,0.3);
    border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 700;
    color: var(--gold); margin-top: 12px;
  }
  .viewer-dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80; }

  /* PÓDIO */
  .podium {
    display: flex; align-items: flex-end; justify-content: center; gap: 10px;
    margin: 28px 0 32px;
  }
  .podium-slot {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    cursor: pointer; transition: transform 0.2s ease;
  }
  .podium-slot:hover { transform: translateY(-4px); }
  .podium-avatar {
    width: 64px; height: 64px; border-radius: 50%; object-fit: cover;
    border: 3px solid var(--muted); background: #2a1810;
  }
  .podium-slot.p1 .podium-avatar { width: 84px; height: 84px; border-color: var(--gold); box-shadow: 0 0 20px rgba(255,176,58,0.5); }
  .podium-slot.p2 .podium-avatar { border-color: #ffcf9e; }
  .podium-slot.p3 .podium-avatar { border-color: #ff9d6a; }
  .podium-name { font-size: 13px; font-weight: 700; max-width: 90px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .podium-stat { font-size: 12px; color: var(--muted); font-weight: 600; }
  .podium-bar {
    width: 90px; border-radius: 8px 8px 0 0;
    background: linear-gradient(180deg, rgba(255,176,58,0.25), rgba(255,90,20,0.1));
    border: 1px solid rgba(255,122,26,0.3); border-bottom: none;
    display: flex; align-items: flex-start; justify-content: center; padding-top: 6px;
  }
  .podium-slot.p1 .podium-bar { height: 70px; order: -1; }
  .podium-slot.p2 .podium-bar { height: 46px; }
  .podium-slot.p3 .podium-bar { height: 30px; }
  .podium-medal { font-size: 20px; }

  .list { display: flex; flex-direction: column; gap: 12px; }
  .row {
    display: grid; grid-template-columns: 40px 32px 1fr auto; align-items: center; gap: 10px;
    background: linear-gradient(180deg, rgba(40,18,10,0.9), rgba(15,7,5,0.9));
    border: 1px solid rgba(255,122,26,0.25); border-radius: 999px; padding: 8px 18px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.4) inset, 0 6px 18px rgba(0,0,0,0.45);
    animation: fadeIn 0.4s ease; cursor: pointer; transition: border-color 0.3s ease, transform 0.3s ease;
  }
  .row.rank-up { animation: fadeIn 0.4s ease, flashUp 0.8s ease; }
  .row.top1 { border-color: rgba(255,176,58,0.75); box-shadow: 0 0 22px rgba(255,140,20,0.35), 0 6px 18px rgba(0,0,0,0.45); }
  .row.top2 { border-color: rgba(255,122,26,0.55); }
  .row.top3 { border-color: rgba(255,90,60,0.45); }
  .rank { font-family: 'Anton', sans-serif; font-size: 18px; color: var(--muted); text-align: center; }
  .top1 .rank { color: var(--gold); }
  .top2 .rank { color: #ffcf9e; }
  .top3 .rank { color: #ff9d6a; }
  .row-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #2a1810; }
  .name { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { display: flex; gap: 14px; font-size: 14px; font-weight: 600; color: var(--muted); }
  .stat { display: flex; align-items: center; gap: 4px; }
  .stat .val { color: var(--text); font-weight: 700; transition: color 0.3s ease; }
  .stat .val.bump { color: var(--gold); }

  .toolbar, .toolbar-row2 { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
  .toolbar-row2 { justify-content: space-between; }
  .search-input {
    flex: 1; min-width: 140px; background: rgba(20,10,8,0.6); border: 1px solid rgba(255,122,26,0.3);
    border-radius: 999px; padding: 10px 16px; color: var(--text); font-family: 'Rajdhani', sans-serif;
    font-weight: 600; font-size: 14px; outline: none;
  }
  .search-input::placeholder { color: var(--muted); }
  .sort-btn {
    background: rgba(20,10,8,0.6); border: 1px solid rgba(255,122,26,0.3); color: var(--muted);
    font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px; padding: 10px 16px;
    border-radius: 999px; cursor: pointer; white-space: nowrap; transition: all 0.2s ease;
  }
  .sort-btn:hover { border-color: var(--gold); color: var(--text); }
  .sort-btn.active { background: linear-gradient(180deg, var(--gold), var(--ember1)); color: #2a1400; border-color: transparent; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; letter-spacing: 1px; }

  .status-banner {
    display: none; align-items: center; justify-content: center; gap: 8px;
    background: rgba(90,20,20,0.4); border: 1px solid rgba(255,70,70,0.4); border-radius: 999px;
    padding: 8px 16px; font-size: 13px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    color: #ff9a9a; margin: 0 auto 24px; width: fit-content;
  }
  .status-banner.show { display: flex; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b3b; box-shadow: 0 0 8px #ff3b3b; }

  .load-more-btn, .reset-btn {
    font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
    border-radius: 999px; cursor: pointer; transition: all 0.2s ease;
  }
  .load-more-btn {
    display: block; margin: 20px auto 0; background: rgba(20,10,8,0.6); border: 1px solid rgba(255,122,26,0.3);
    color: var(--muted); font-size: 13px; padding: 10px 24px;
  }
  .load-more-btn:hover { border-color: var(--gold); color: var(--text); }
  .reset-btn { background: transparent; border: 1px solid rgba(255,122,26,0.35); color: var(--muted); font-size: 12px; padding: 8px 18px; }
  .reset-btn:hover { color: var(--ember2); border-color: var(--ember2); }

  /* MODAL DE PERFIL */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100;
    align-items: center; justify-content: center; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-box {
    background: linear-gradient(180deg, #1a0e08, #0a0605); border: 1px solid rgba(255,122,26,0.4);
    border-radius: 20px; padding: 24px; max-width: 400px; width: 100%; max-height: 80vh; overflow-y: auto;
  }
  .modal-close { float: right; background: none; border: none; color: var(--muted); font-size: 22px; cursor: pointer; }
  .modal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .modal-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: #2a1810; }
  .modal-name { font-size: 18px; font-weight: 700; }
  .modal-summary { display: flex; gap: 16px; margin-bottom: 16px; font-size: 14px; color: var(--muted); }
  .modal-summary .val { color: var(--gold); font-weight: 700; }
  .modal-gift-list { display: flex; flex-direction: column; gap: 8px; }
  .modal-gift-row {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,122,26,0.08); border-radius: 10px; padding: 8px 12px; font-size: 14px;
  }
  .modal-empty { text-align: center; color: var(--muted); padding: 20px 0; font-size: 14px; }

  .stats-bar {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(90px, 1fr));
  gap: 8px; margin: 20px 0 28px;
}
.stats-card {
  background: rgba(20,10,8,0.6); border: 1px solid rgba(255,122,26,0.25);
  border-radius: 14px; padding: 10px 8px; text-align: center;
}
.stats-card .num { font-family: 'Anton', sans-serif; font-size: 20px; color: var(--gold); }
.stats-card .lbl { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-top: 2px; }

.feed-panel {
  background: rgba(15,7,5,0.7); border: 1px solid rgba(255,122,26,0.2);
  border-radius: 16px; padding: 14px; margin-bottom: 24px; max-height: 220px; overflow-y: auto;
}
.feed-title { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--gold); font-weight: 700; margin-bottom: 8px; }
.feed-item { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 5px 0; border-bottom: 1px solid rgba(255,122,26,0.08); animation: fadeIn 0.3s ease; }
.feed-item:last-child { border-bottom: none; }
.feed-avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: #2a1810; flex-shrink: 0; }
.feed-text { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.feed-text b { color: var(--text); }

.badge-tag {
  font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px;
  background: rgba(255,122,26,0.15); color: var(--gold); margin-left: 4px;
}

  @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes flashUp { 0% { border-color: #4ade80; } 100% { border-color: rgba(255,122,26,0.25); } }
</style>
</head>
<body>

<canvas id="embers"></canvas>
<canvas id="confetti"></canvas>

<div class="wrap">
  <header>
    <div class="eyebrow">Ao vivo agora</div>
    <h1>Ranking da Live</h1>
    <div class="sub">Quem mais tá na treta hoje 🔥</div>
    <div class="viewer-badge" id="viewerBadge" style="display:none;">
      <span class="viewer-dot"></span>
      <span id="viewerCount">0</span> assistindo
    </div>
  </header>

  <div class="status-banner" id="statusBanner">
    <span class="status-dot"></span>
    <span>Live offline — mostrando resultados da última live</span>
  </div>
  <div class="stats-bar" id="statsBar"></div>

<div class="feed-panel">
  <div class="feed-title">🔴 Ao vivo agora</div>
  <div id="feedList"></div>
</div>
  <div class="podium" id="podium"></div>

  <div class="toolbar">
    <input type="text" class="search-input" id="searchInput" placeholder="Buscar usuário...">
  </div>

  <div class="toolbar-row2">
    <div style="display:flex; gap:10px;">
      <button class="sort-btn active" id="sortLikes" data-sort="likes">❤️ Likes</button>
      <button class="sort-btn" id="sortGifts" data-sort="gifts_value">🎁 Presentes</button>
      <button class="sort-btn" id="sortComments" data-sort="comments">💬 Comentários</button>
    </div>
    <button class="reset-btn" id="resetBtn">Resetar dados</button>
  </div>

  <div class="list" id="ranking">
    <div class="empty">Esperando a live começar...</div>
  </div>

  <button class="load-more-btn" id="loadMoreBtn" style="display:none;">Carregar mais</button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">×</button>
    <div class="modal-header">
      <img class="modal-avatar" id="modalAvatar" src="" alt="">
      <div>
        <div class="modal-name" id="modalName">—</div>
      </div>
    </div>
    <div class="modal-summary">
      <div>❤️ <span class="val" id="modalLikes">0</span></div>
      <div>🎁 <span class="val" id="modalGiftsValue">0</span></div>
    </div>
    <div class="modal-gift-list" id="modalGiftList"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const container = document.getElementById('ranking');
  const podiumEl = document.getElementById('podium');
  const statusBanner = document.getElementById('statusBanner');
  const resetBtn = document.getElementById('resetBtn');
  const searchInput = document.getElementById('searchInput');
  const sortButtons = document.querySelectorAll('.sort-btn');
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const viewerBadge = document.getElementById('viewerBadge');
  const viewerCountEl = document.getElementById('viewerCount');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalClose = document.getElementById('modalClose');

  let latestData = [];
  let currentSort = 'likes';
  let currentSearch = '';
  const PAGE_SIZE = 15;
  let visibleCount = PAGE_SIZE;
  let previousTop3Ids = [];
  let previousRankMap = {};
  const FALLBACK_AVATAR = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="%232a1810"/><text x="32" y="40" font-size="28" text-anchor="middle" fill="%239c8b7d">?</text></svg>`
  );

  sortButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      currentSort = btn.dataset.sort;
      sortButtons.forEach(b => b.classList.toggle('active', b === btn));
      visibleCount = PAGE_SIZE;
      render();
    });
  });

  searchInput.addEventListener('input', () => {
    currentSearch = searchInput.value.trim().toLowerCase();
    visibleCount = PAGE_SIZE;
    render();
  });

  loadMoreBtn.addEventListener('click', () => {
    visibleCount += PAGE_SIZE;
    render();
  });

  const statsBarEl = document.getElementById('statsBar');
const feedListEl = document.getElementById('feedList');
let globalStartedAt = null;

function formatUptime(seconds) {
  const h = Math.floor(seconds / 3600);
  const m = Math.floor((seconds % 3600) / 60);
  const s = seconds % 60;
  return h > 0 ? `${h}h${String(m).padStart(2,'0')}m` : `${m}m${String(s).padStart(2,'0')}s`;
}

function renderStatsBar(stats) {
  globalStartedAt = Date.now() - stats.uptimeSeconds * 1000;
  statsBarEl.innerHTML = `
    <div class="stats-card"><div class="num">${stats.currentViewers.toLocaleString('pt-BR')}</div><div class="lbl">Assistindo</div></div>
    <div class="stats-card"><div class="num">${stats.peakViewers.toLocaleString('pt-BR')}</div><div class="lbl">Pico</div></div>
    <div class="stats-card"><div class="num">${stats.uniqueViewers.toLocaleString('pt-BR')}</div><div class="lbl">Únicos</div></div>
    <div class="stats-card"><div class="num">${stats.totalDiamonds.toLocaleString('pt-BR')}</div><div class="lbl">💎 Total</div></div>
    <div class="stats-card"><div class="num">${stats.totalComments.toLocaleString('pt-BR')}</div><div class="lbl">💬 Coment.</div></div>
    <div class="stats-card"><div class="num">${stats.totalFollows.toLocaleString('pt-BR')}</div><div class="lbl">➕ Seguiram</div></div>
    <div class="stats-card"><div class="num" id="uptimeVal">${formatUptime(stats.uptimeSeconds)}</div><div class="lbl">⏱ Duração</div></div>
  `;
}

socket.on('global_stats', renderStatsBar);

setInterval(() => {
  if (globalStartedAt) {
    const el = document.getElementById('uptimeVal');
    if (el) el.textContent = formatUptime(Math.floor((Date.now() - globalStartedAt) / 1000));
  }
}, 1000);

const FEED_ICONS = { chat: '💬', follow: '➕', share: '🔁', join: '👋', gift: '🎁' };
function feedLine(event) {
  const icon = FEED_ICONS[event.type] || '•';
  const nome = event.nickname || event.uniqueId;
  let texto = '';
  if (event.type === 'chat') texto = `<b>${nome}</b>: ${event.text}`;
  else if (event.type === 'follow') texto = `<b>${nome}</b> começou a seguir`;
  else if (event.type === 'share') texto = `<b>${nome}</b> compartilhou a live`;
  else if (event.type === 'join') texto = `<b>${nome}</b> entrou na live`;
  return `
    <div class="feed-item">
      <img class="feed-avatar" src="${avatarOf(event)}" onerror="this.src='${FALLBACK_AVATAR}'">
      <span>${icon}</span>
      <span class="feed-text">${texto}</span>
    </div>
  `;
}

function addFeedItem(event) {
  feedListEl.insertAdjacentHTML('afterbegin', feedLine(event));
  while (feedListEl.children.length > 30) feedListEl.removeChild(feedListEl.lastChild);
}

socket.on('live_feed_init', events => {
  feedListEl.innerHTML = '';
  events.slice().reverse().forEach(addFeedItem);
});
socket.on('live_feed_event', addFeedItem);

  socket.on('live_status', ({ online }) => {
    statusBanner.classList.toggle('show', !online);
  });

  socket.on('viewer_count', ({ count }) => {
    viewerBadge.style.display = 'inline-flex';
    viewerCountEl.textContent = count.toLocaleString('pt-BR');
  });

  resetBtn.addEventListener('click', async () => {
    const confirmado = confirm('Tem certeza que quer resetar TODOS os dados salvos? Essa ação não pode ser desfeita.');
    if (!confirmado) return;
    resetBtn.disabled = true;
    resetBtn.textContent = 'Resetando...';
    try {
      await fetch('/api/reset', { method: 'POST' });
      previousTop3Ids = [];
      previousRankMap = {};
    } catch (e) {
      alert('Erro ao resetar. Verifica se o servidor está rodando.');
    } finally {
      resetBtn.disabled = false;
      resetBtn.textContent = 'Resetar dados';
    }
  });

  socket.on('ranking', data => {
    latestData = data;
    render();
  });

  function avatarOf(u) {
    return u.avatar || FALLBACK_AVATAR;
  }

  function renderPodium(list) {
    const top3 = list.slice(0, 3);
    if (!top3.length) { podiumEl.innerHTML = ''; return; }

    const medals = ['🥇', '🥈', '🥉'];
    const order = [1, 0, 2]; // renderiza 2º, 1º, 3º na tela (1º no meio, mais alto)

    podiumEl.innerHTML = order
      .filter(i => top3[i])
      .map(i => {
        const u = top3[i];
        const cls = `p${i + 1}`;
        return `
          <div class="podium-slot ${cls}" data-uid="${u.uniqueId}">
            <div class="podium-medal">${medals[i]}</div>
            <img class="podium-avatar" src="${avatarOf(u)}" onerror="this.src='${FALLBACK_AVATAR}'">
            <div class="podium-name">${u.nickname || u.uniqueId}</div>
            <div class="podium-stat">❤️ ${u[currentSort === 'gifts_value' ? 'gifts_value' : 'likes']}</div>
            <div class="podium-bar"></div>
          </div>
        `;
      }).join('');

    podiumEl.querySelectorAll('.podium-slot').forEach(el => {
      el.addEventListener('click', () => openProfile(el.dataset.uid));
    });

    const newTop3Ids = top3.map(u => u.uniqueId);
    const enteredTop3 = newTop3Ids.filter(id => !previousTop3Ids.includes(id));
    if (previousTop3Ids.length && enteredTop3.length) {
      fireConfetti();
      playSound('levelup');
    }
    previousTop3Ids = newTop3Ids;
  }

  function render() {
    let list = latestData.filter(u => {
      if (!currentSearch) return true;
      const alvo = `${u.nickname || ''} ${u.uniqueId || ''}`.toLowerCase();
      return alvo.includes(currentSearch);
    });

    list = [...list].sort((a, b) => (b[currentSort] || 0) - (a[currentSort] || 0));

    renderPodium(list);

    if (!list.length) {
      container.innerHTML = `<div class="empty">${currentSearch ? 'Nenhum usuário encontrado.' : 'Esperando a live começar...'}</div>`;
      loadMoreBtn.style.display = 'none';
      return;
    }

    const visibleList = list.slice(0, visibleCount);
    const newRankMap = {};

    container.innerHTML = visibleList.map((u, i) => {
      newRankMap[u.uniqueId] = i;
      const prevRank = previousRankMap[u.uniqueId];
      const rankedUp = prevRank !== undefined && i < prevRank;
      const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
      const crown = i === 0 ? '👑' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
      return `
        <div class="row ${rankClass} ${rankedUp ? 'rank-up' : ''}" data-uid="${u.uniqueId}">
          <div class="rank">${i + 1}</div>
          <img class="row-avatar" src="${avatarOf(u)}" onerror="this.src='${FALLBACK_AVATAR}'">
          <div class="name">
  ${crown ? `<span class="crown">${crown}</span>` : ''}${u.nickname || u.uniqueId}
  ${u.followed ? '<span class="badge-tag">Seguiu</span>' : ''}
  ${u.shared ? '<span class="badge-tag">🔁</span>' : ''}
</div>
          <div class="stats">
            <div class="stat">❤️ <span class="val">${u.likes}</span></div>
            <div class="stat">🎁 <span class="val">${u.gifts_value}</span></div>
          </div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.row').forEach(el => {
      el.addEventListener('click', () => openProfile(el.dataset.uid));
    });

    if (Object.keys(previousRankMap).length) {
      const anyoneRankedUp = Object.keys(newRankMap).some(uid =>
        previousRankMap[uid] !== undefined && newRankMap[uid] < previousRankMap[uid]
      );
      if (anyoneRankedUp) playSound('rankup');
    }
    previousRankMap = newRankMap;

    loadMoreBtn.style.display = list.length > visibleCount ? 'block' : 'none';
  }

  // ---------- MODAL DE PERFIL ----------
  async function openProfile(uniqueId) {
    try {
      const res = await fetch(`/api/user/${encodeURIComponent(uniqueId)}`);
      if (!res.ok) return;
      const { user, history } = await res.json();

      document.getElementById('modalAvatar').src = avatarOf(user);
      document.getElementById('modalName').textContent = user.nickname || user.uniqueId;
      document.getElementById('modalLikes').textContent = user.likes;
      document.getElementById('modalGiftsValue').textContent = user.gifts_value;

      const gifts = history.filter(h => h.type === 'gift' || h.type === 'powerup');
      const listEl = document.getElementById('modalGiftList');
      if (!gifts.length) {
        listEl.innerHTML = `<div class="modal-empty">Nenhum presente enviado ainda.</div>`;
      } else {
        listEl.innerHTML = gifts
          .sort((a, b) => (b.value || 0) - (a.value || 0))
          .map(g => `
            <div class="modal-gift-row">
              <span>🎁 ${g.detail || 'Presente'}</span>
              <span>x${g.count || 1} — ${g.value || 0}💎</span>
            </div>
          `).join('');
      }

      modalOverlay.classList.add('show');
    } catch (e) {
      console.error('Erro ao carregar perfil:', e);
    }
  }

  modalClose.addEventListener('click', () => modalOverlay.classList.remove('show'));
  modalOverlay.addEventListener('click', e => {
    if (e.target === modalOverlay) modalOverlay.classList.remove('show');
  });

  // ---------- SONS (sintetizados, sem arquivo externo) ----------
  let audioCtx;
  function playSound(type) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'rankup') {
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'levelup') {
        [660, 880, 1100].forEach((freq, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.08 + 0.25);
          o.start(audioCtx.currentTime + i * 0.08);
          o.stop(audioCtx.currentTime + i * 0.08 + 0.25);
        });
      }
    } catch (e) { /* navegador pode bloquear áudio antes de interação do usuário */ }
  }

  // ---------- CONFETE ----------
  const confettiCanvas = document.getElementById('confetti');
  const confettiCtx = confettiCanvas.getContext('2d');
  let confettiPieces = [];
  function resizeConfetti() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeConfetti);
  resizeConfetti();

  function fireConfetti() {
    const colors = ['#ffb03a', '#ff7a1a', '#ff2d2d', '#ffe9b0'];
    for (let i = 0; i < 80; i++) {
      confettiPieces.push({
        x: confettiCanvas.width / 2 + (Math.random() - 0.5) * 200,
        y: -20,
        vx: (Math.random() - 0.5) * 6,
        vy: Math.random() * 3 + 2,
        size: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 10,
        life: 0
      });
    }
  }

  function tickConfetti() {
    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    confettiPieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.rotation += p.rotSpeed; p.life++;
      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rotation * Math.PI / 180);
      confettiCtx.fillStyle = p.color;
      confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      confettiCtx.restore();
    });
    confettiPieces = confettiPieces.filter(p => p.y < confettiCanvas.height + 20 && p.life < 300);
    requestAnimationFrame(tickConfetti);
  }
  tickConfetti();

  // ---------- Partículas de fogo (fundo) ----------
  const canvas = document.getElementById('embers');
  const ctx = canvas.getContext('2d');
  let w, h;
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();
  const particles = Array.from({ length: 45 }, () => spawn());
  function spawn(initial) {
    return {
      x: Math.random() * w, y: initial ? Math.random() * h : h + 20,
      r: 1 + Math.random() * 2.2, speed: 0.4 + Math.random() * 1.1,
      drift: (Math.random() - 0.5) * 0.6, life: Math.random(), flicker: Math.random() * 0.02 + 0.01
    };
  }
  particles.forEach(p => Object.assign(p, spawn(true)));
  function tick() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.y -= p.speed; p.x += p.drift; p.life += p.flicker;
      const alpha = 0.5 + Math.sin(p.life * 10) * 0.3;
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      grad.addColorStop(0, `rgba(255, 170, 60, ${Math.max(alpha, 0)})`);
      grad.addColorStop(1, 'rgba(255, 60, 20, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2); ctx.fill();
      if (p.y < -20 || p.x < -20 || p.x > w + 20) Object.assign(p, spawn(false));
    });
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
