<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ranking da Live</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bungee&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0807;
    --card: #150f0b;
    --card-2: #0f0b08;
    --line: #2b2119;
    --ink: #f3e9dc;
    --ink-dim: #9c8b7d;
    --ink-faint: #5a4c40;
    --gold: #ffb03a;
    --ember1: #ff7a1a;
    --ember2: #ff2d2d;
    --sidebar-w: 300px;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%;
    background:
      radial-gradient(700px 420px at 12% -6%, rgba(255,122,26,.14), transparent 60%),
      radial-gradient(900px 600px at 100% 0%, rgba(255,45,45,.08), transparent 55%),
      var(--bg);
    color: var(--ink); font-family: 'Rajdhani', sans-serif; font-weight: 600;
    overflow-x: hidden;
  }
  a { color: inherit; }
  canvas#embers, canvas#confetti { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
  canvas#confetti { z-index: 60; }

  /* ---------- SHELL ---------- */
  .shell {
    position: relative; z-index: 1;
    max-width: 1180px; margin: 0 auto;
    padding: 28px 20px 70px;
    display: grid;
    grid-template-columns: var(--sidebar-w) 1fr;
    gap: 26px;
    align-items: start;
  }
  @media (max-width: 880px) {
    .shell { grid-template-columns: 1fr; }
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar {
    display: flex; flex-direction: column; gap: 18px;
    position: sticky; top: 20px;
  }
  @media (max-width: 880px) { .sidebar { position: static; } }

  .brand-card {
    background: linear-gradient(165deg, var(--card), var(--card-2));
    border: 1px solid var(--line); border-radius: 18px; padding: 22px 20px;
  }
  .eyebrow {
    display: flex; align-items: center; gap: 7px;
    font-size: 11.5px; letter-spacing: .14em; color: var(--gold); font-weight: 700;
  }
  .eyebrow .dot { width: 6px; height: 6px; border-radius: 50%; background: #4ade80; box-shadow: 0 0 6px #4ade80; flex-shrink:0; }
  .eyebrow.is-offline .dot { background: #ff3b3b; box-shadow: 0 0 6px #ff3b3b; }
  h1.brand-title {
    font-family: 'Bungee', sans-serif; font-weight: 400;
    font-size: 30px; line-height: 1.05; letter-spacing: .01em;
    margin: 10px 0 6px;
    background: linear-gradient(180deg, #ffe9b0 0%, var(--gold) 30%, var(--ember1) 65%, #a3230f 100%);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .brand-sub { font-size: 13.5px; color: var(--ink-dim); margin: 0; }

  .viewer-line {
    display: flex; align-items: center; gap: 8px;
    margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line);
    font-size: 13px; color: var(--ink-dim); font-weight: 700;
  }
  .viewer-line .num { color: var(--ink); font-size: 15px; }
  .viewer-line[hidden] { display: none; }

  .sidebar-section {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 16px 18px;
  }
  .sidebar-section h2 {
    font-family: 'Bungee', sans-serif; font-weight: 400; font-size: 12px;
    letter-spacing: .06em; color: var(--ink-dim); margin: 0 0 12px;
  }

  .stats-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 8px;
  }
  .stats-card {
    background: var(--card-2); border: 1px solid var(--line);
    border-radius: 12px; padding: 10px 8px; text-align: center;
  }
  .stats-card .num { font-family: 'Bungee', sans-serif; font-size: 17px; color: var(--gold); }
  .stats-card .lbl { font-size: 10px; color: var(--ink-dim); margin-top: 3px; }

  .nav-btn {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    width: 100%; text-decoration: none; cursor: pointer;
    background: linear-gradient(180deg, var(--gold), var(--ember1));
    color: #2a1400; font-weight: 700; font-size: 13.5px;
    padding: 12px 14px; border-radius: 12px; border: none;
    font-family: 'Rajdhani', sans-serif;
  }

  .ghost-btn {
    display: flex; align-items: center; justify-content: center; gap: 7px;
    width: 100%; cursor: pointer; background: transparent;
    border: 1.5px solid var(--line); color: var(--ink-dim);
    font-weight: 700; font-size: 13px; padding: 11px 14px; border-radius: 12px;
    font-family: 'Rajdhani', sans-serif;
  }
  .ghost-btn:hover { border-color: var(--ink-faint); color: var(--ink); }
  .danger-btn { border-color: rgba(255,61,26,.4); color: #ff8a6a; }
  .danger-btn:hover { border-color: var(--ember2); color: var(--ember2); }

  /* ---------- MAIN ---------- */
  .main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }

  .status-banner {
    display: none; align-items: center; justify-content: center; gap: 8px;
    background: rgba(90,20,20,0.35); border: 1px solid rgba(255,70,70,0.4); border-radius: 999px;
    padding: 9px 16px; font-size: 13px; font-weight: 700; letter-spacing: .04em;
    color: #ff9a9a; width: fit-content; margin: 0 auto;
  }
  .status-banner.show { display: flex; }
  .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #ff3b3b; box-shadow: 0 0 8px #ff3b3b; }

  .podium { display: flex; align-items: flex-end; justify-content: center; gap: 12px; padding-top: 6px; }
  .podium-slot { display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; transition: transform 0.2s ease; }
  .podium-slot:hover { transform: translateY(-4px); }
  .podium-avatar { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; border: 3px solid var(--ink-faint); background: #2a1810; }
  .podium-slot.p1 .podium-avatar { width: 86px; height: 86px; border-color: var(--gold); box-shadow: 0 0 22px rgba(255,176,58,0.5); }
  .podium-slot.p2 .podium-avatar { border-color: #ffcf9e; }
  .podium-slot.p3 .podium-avatar { border-color: #ff9d6a; }
  .podium-name { font-size: 13px; font-weight: 700; max-width: 96px; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .podium-stat { font-size: 12px; color: var(--ink-dim); font-weight: 600; }
  .podium-bar {
    width: 96px; border-radius: 10px 10px 0 0;
    background: linear-gradient(180deg, rgba(255,176,58,0.22), rgba(255,90,20,0.08));
    border: 1px solid rgba(255,122,26,0.28); border-bottom: none;
  }
  .podium-slot.p1 .podium-bar { height: 72px; }
  .podium-slot.p2 .podium-bar { height: 48px; }
  .podium-slot.p3 .podium-bar { height: 30px; }
  .podium-medal { font-size: 20px; }

  .panel { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; }
  .panel-title {
    font-family: 'Bungee', sans-serif; font-weight: 400; font-size: 12px;
    letter-spacing: .06em; color: var(--gold); margin: 0 0 10px;
  }

  .feed-panel { max-height: 190px; overflow-y: auto; }
  .feed-item { display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .feed-item:last-child { border-bottom: none; }
  .feed-avatar { width: 22px; height: 22px; border-radius: 50%; object-fit: cover; background: #2a1810; flex-shrink: 0; }
  .feed-text { flex: 1; min-width: 0; color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .feed-text b { color: var(--gold); }
  .feed-empty { text-align: center; color: var(--ink-faint); font-size: 13px; padding: 14px 0; }

  /* Controls row above the ranking list */
  .list-controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .search-input {
    flex: 1; min-width: 160px; background: var(--card-2); border: 1px solid var(--line);
    border-radius: 999px; padding: 10px 16px; color: var(--ink); font-family: 'Rajdhani', sans-serif;
    font-weight: 600; font-size: 14px; outline: none;
  }
  .search-input::placeholder { color: var(--ink-faint); }
  .search-input:focus { border-color: var(--gold); }
  .sort-group { display: flex; gap: 8px; flex-wrap: wrap; }
  .sort-btn {
    background: var(--card-2); border: 1px solid var(--line); color: var(--ink-dim);
    font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 13px; padding: 10px 15px;
    border-radius: 999px; cursor: pointer; white-space: nowrap; transition: all 0.15s ease;
  }
  .sort-btn:hover { border-color: var(--gold); color: var(--ink); }
  .sort-btn.active { background: linear-gradient(180deg, var(--gold), var(--ember1)); color: #2a1400; border-color: transparent; }

  .list { display: flex; flex-direction: column; gap: 10px; }
  .row {
    display: grid; grid-template-columns: 34px 32px 1fr auto; align-items: center; gap: 10px;
    background: linear-gradient(180deg, rgba(40,18,10,0.55), rgba(15,7,5,0.55));
    border: 1px solid var(--line); border-radius: 999px; padding: 8px 16px;
    cursor: pointer; transition: border-color 0.3s ease;
  }
  .row.rank-up { animation: flashUp 0.8s ease; }
  .row.top1 { border-color: rgba(255,176,58,0.7); box-shadow: 0 0 18px rgba(255,140,20,0.28); }
  .row.top2 { border-color: rgba(255,122,26,0.5); }
  .row.top3 { border-color: rgba(255,90,60,0.4); }
  .rank { font-family: 'Bungee', sans-serif; font-size: 15px; color: var(--ink-dim); text-align: center; }
  .top1 .rank { color: var(--gold); }
  .top2 .rank { color: #ffcf9e; }
  .top3 .rank { color: #ff9d6a; }
  .row-avatar { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; background: #2a1810; }
  .name { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .stats { display: flex; gap: 14px; font-size: 13.5px; font-weight: 600; color: var(--ink-dim); }
  .stat { display: flex; align-items: center; gap: 4px; }
  .stat .val { color: var(--ink); font-weight: 700; }
  .badge-tag { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 999px; background: rgba(255,122,26,0.15); color: var(--gold); }
  .empty { text-align: center; color: var(--ink-dim); padding: 40px 0; font-size: 15px; }

  .load-more-btn {
    display: block; margin: 4px auto 0; background: var(--card-2); border: 1px solid var(--line);
    color: var(--ink-dim); font-family: 'Rajdhani', sans-serif; font-weight: 700; letter-spacing: .03em;
    font-size: 13px; padding: 10px 24px; border-radius: 999px; cursor: pointer;
  }
  .load-more-btn:hover { border-color: var(--gold); color: var(--ink); }

  /* History */
  .history-toggle {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    cursor: pointer; user-select: none;
  }
  .history-toggle .caret { color: var(--ink-dim); font-size: 12px; transition: transform .2s ease; }
  .history-toggle.open .caret { transform: rotate(180deg); }
  .history-list { display: none; flex-direction: column; gap: 8px; margin-top: 12px; }
  .history-list.show { display: flex; }
  .history-item {
    background: var(--card-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .history-item .when { font-size: 13.5px; font-weight: 700; }
  .history-item .nums { font-size: 12.5px; color: var(--ink-dim); }

  /* Modal */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 100; align-items: center; justify-content: center; padding: 20px; }
  .modal-overlay.show { display: flex; }
  .modal-box { background: linear-gradient(180deg, #1a0e08, #0a0605); border: 1px solid var(--line); border-radius: 20px; padding: 24px; max-width: 400px; width: 100%; max-height: 80vh; overflow-y: auto; }
  .modal-close { float: right; background: none; border: none; color: var(--ink-dim); font-size: 22px; cursor: pointer; }
  .modal-header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .modal-avatar { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; background: #2a1810; }
  .modal-name { font-size: 18px; font-weight: 700; }
  .modal-summary { display: flex; gap: 16px; margin-bottom: 16px; font-size: 14px; color: var(--ink-dim); }
  .modal-summary .val { color: var(--gold); font-weight: 700; }
  .modal-gift-list { display: flex; flex-direction: column; gap: 8px; }
  .modal-gift-row { display: flex; justify-content: space-between; align-items: center; background: rgba(255,122,26,0.08); border-radius: 10px; padding: 8px 12px; font-size: 14px; }
  .modal-empty { text-align: center; color: var(--ink-dim); padding: 20px 0; font-size: 14px; }
  .modal-section-title {
    font-family: 'Bungee', cursive; font-size: 11px; letter-spacing: .06em;
    color: var(--ink-dim); margin: 0 0 10px;
  }
  .modal-comment-row {
    background: rgba(255,122,26,0.08); border-radius: 10px; padding: 8px 12px;
    font-size: 14px; color: var(--ink); word-break: break-word;
  }
  .modal-comment-row .when { display: block; font-size: 11px; color: var(--ink-dim); margin-top: 3px; }

  @keyframes flashUp { 0% { border-color: #4ade80; } 100% { border-color: var(--line); } }
</style>
</head>
<body>

<canvas id="embers"></canvas>
<canvas id="confetti"></canvas>

<div class="shell">

  <!-- ================= SIDEBAR ================= -->
  <aside class="sidebar">

    <div class="brand-card">
      <div class="eyebrow" id="liveEyebrow"><span class="dot"></span>Ao vivo agora</div>
      <h1 class="brand-title">Ranking da Live</h1>
      <p class="brand-sub">Quem mais tá na treta hoje 🔥</p>
      <div class="viewer-line" id="viewerBadge" hidden>
        👀 <span class="num" id="viewerCount">0</span> assistindo agora
      </div>
    </div>

    <div class="sidebar-section">
      <h2>Números da live</h2>
      <div class="stats-grid" id="statsBar"></div>
    </div>

    <div class="sidebar-section" style="display:flex; flex-direction:column; gap:8px;">
      <h2>Ações</h2>
      <a class="nav-btn" href="/mural.html">🖼️ Ver Mural da Tropa</a>
      <button class="ghost-btn" id="toggleHistoryBtn">
        <span>📜 Histórico de lives</span>
      </button>
      <button class="ghost-btn danger-btn" id="resetBtn">🗑️ Resetar dados</button>
      <button class="ghost-btn" id="logoutBtn">🚪 Sair</button>
    </div>

  </aside>

  <!-- ================= MAIN ================= -->
  <main class="main">

    <div class="status-banner" id="statusBanner">
      <span class="status-dot"></span>
      <span>Live offline — mostrando resultados da última live</span>
    </div>

    <div class="podium" id="podium"></div>

    <section class="panel">
      <div class="panel-title">Feed ao vivo</div>
      <div class="feed-panel" id="feedPanel">
        <div id="feedList"></div>
      </div>
    </section>

    <section class="panel">
      <div class="panel-title">Ranking</div>

      <div class="list-controls" style="margin-bottom: 14px;">
        <input type="text" class="search-input" id="searchInput" placeholder="Buscar usuário...">
        <div class="sort-group">
          <button class="sort-btn active" data-sort="likes">❤️ Likes</button>
          <button class="sort-btn" data-sort="gifts_value">🎁 Presentes</button>
          <button class="sort-btn" data-sort="comments">💬 Comentários</button>
        </div>
      </div>

      <div class="list" id="ranking">
        <div class="empty">Esperando a live começar...</div>
      </div>

      <button class="load-more-btn" id="loadMoreBtn" style="display:none;">Carregar mais</button>
    </section>

    <section class="panel" id="historySection" style="display:none;">
      <div class="history-toggle" id="historyToggleRow">
        <div class="panel-title" style="margin:0;">Histórico de lives · até o último reset</div>
        <span class="caret">▾</span>
      </div>
      <div class="history-list" id="historyList"></div>
    </section>

  </main>

</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal-box">
    <button class="modal-close" id="modalClose">×</button>
    <div class="modal-header">
      <img class="modal-avatar" id="modalAvatar" src="" alt="">
      <div>
        <div class="modal-name" id="modalName">—</div>
      </div>
    </div>
    <div class="modal-summary">
      <div>❤️ <span class="val" id="modalLikes">0</span></div>
      <div>🎁 <span class="val" id="modalGiftsValue">0</span></div>
      <div>💬 <span class="val" id="modalComments">0</span></div>
    </div>
    <div class="modal-gift-list" id="modalGiftList"></div>
    <div class="modal-gift-list" id="modalCommentList"></div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const socket = io();
  const container = document.getElementById('ranking');
  const podiumEl = document.getElementById('podium');
  const statusBanner = document.getElementById('statusBanner');
  const liveEyebrow = document.getElementById('liveEyebrow');
  const resetBtn = document.getElementById('resetBtn');
  const logoutBtn = document.getElementById('logoutBtn');
  const searchInput = document.getElementById('searchInput');
  const sortButtons = document.querySelectorAll('.sort-btn');
  const loadMoreBtn = document.getElementById('loadMoreBtn');
  const viewerBadge = document.getElementById('viewerBadge');
  const viewerCountEl = document.getElementById('viewerCount');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalClose = document.getElementById('modalClose');

  let latestData = [];
  let currentSort = 'likes';
  let currentSearch = '';
  const PAGE_SIZE = 15;
  let visibleCount = PAGE_SIZE;
  let previousTop3Ids = [];
  let previousRankMap = {};
  const FALLBACK_AVATAR = 'data:image/svg+xml;utf8,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" fill="%232a1810"/><text x="32" y="40" font-size="28" text-anchor="middle" fill="%239c8b7d">?</text></svg>`
  );

  sortButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      currentSort = btn.dataset.sort;
      sortButtons.forEach(b => b.classList.toggle('active', b === btn));
      visibleCount = PAGE_SIZE;
      render();
    });
  });

  searchInput.addEventListener('input', () => {
    currentSearch = searchInput.value.trim().toLowerCase();
    visibleCount = PAGE_SIZE;
    render();
  });

  loadMoreBtn.addEventListener('click', () => {
    visibleCount += PAGE_SIZE;
    render();
  });

  const statsBarEl = document.getElementById('statsBar');
  const feedListEl = document.getElementById('feedList');
  let globalStartedAt = null;

  function formatUptime(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;
    return h > 0 ? `${h}h${String(m).padStart(2,'0')}m` : `${m}m${String(s).padStart(2,'0')}s`;
  }

  function renderStatsBar(stats) {
    globalStartedAt = Date.now() - stats.uptimeSeconds * 1000;
    statsBarEl.innerHTML = `
      <div class="stats-card"><div class="num">${stats.currentViewers.toLocaleString('pt-BR')}</div><div class="lbl">Assistindo</div></div>
      <div class="stats-card"><div class="num">${stats.peakViewers.toLocaleString('pt-BR')}</div><div class="lbl">Pico</div></div>
      <div class="stats-card"><div class="num">${stats.uniqueViewers.toLocaleString('pt-BR')}</div><div class="lbl">Únicos</div></div>
      <div class="stats-card"><div class="num">${stats.totalDiamonds.toLocaleString('pt-BR')}</div><div class="lbl">💎 Total</div></div>
      <div class="stats-card"><div class="num">${stats.totalComments.toLocaleString('pt-BR')}</div><div class="lbl">💬 Coment.</div></div>
      <div class="stats-card"><div class="num">${stats.totalFollows.toLocaleString('pt-BR')}</div><div class="lbl">➕ Seguiram</div></div>
      <div class="stats-card" style="grid-column: span 2;"><div class="num" id="uptimeVal">${formatUptime(stats.uptimeSeconds)}</div><div class="lbl">⏱ Duração da live</div></div>
    `;
  }

  socket.on('global_stats', renderStatsBar);

  setInterval(() => {
    if (globalStartedAt) {
      const el = document.getElementById('uptimeVal');
      if (el) el.textContent = formatUptime(Math.floor((Date.now() - globalStartedAt) / 1000));
    }
  }, 1000);

  // Comentário é texto de usuário: sem escapar, um "<" já sumia com a linha
  // inteira no innerHTML (era isso que fazia o comentário "não aparecer").
  function esc(txt) {
    return String(txt ?? '').replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  const FEED_ICONS = { chat: '💬', follow: '➕', share: '🔁', join: '👋', gift: '🎁' };
  function feedLine(event) {
    const icon = FEED_ICONS[event.type] || '•';
    const nome = esc(event.nickname || event.uniqueId);
    let texto = '';
    if (event.type === 'chat') {
      const msg = (event.text || '').trim();
      texto = `<b>${nome}</b>: ${msg ? esc(msg) : '<i>(sem texto)</i>'}`;
    }
    else if (event.type === 'follow') texto = `<b>${nome}</b> começou a seguir`;
    else if (event.type === 'share') texto = `<b>${nome}</b> compartilhou a live`;
    else if (event.type === 'join') texto = `<b>${nome}</b> entrou na live`;
    return `
      <div class="feed-item">
        <img class="feed-avatar" src="${avatarOf(event)}" onerror="this.src='${FALLBACK_AVATAR}'">
        <span>${icon}</span>
        <span class="feed-text">${texto}</span>
      </div>
    `;
  }

  function addFeedItem(event) {
    feedListEl.insertAdjacentHTML('afterbegin', feedLine(event));
    while (feedListEl.children.length > 30) feedListEl.removeChild(feedListEl.lastChild);
  }

  socket.on('live_feed_init', events => {
    feedListEl.innerHTML = events.length ? '' : '<div class="feed-empty">Nada por aqui ainda.</div>';
    events.slice().reverse().forEach(addFeedItem);
  });
  socket.on('live_feed_event', event => {
    const emptyEl = feedListEl.querySelector('.feed-empty');
    if (emptyEl) emptyEl.remove();
    addFeedItem(event);
  });

  socket.on('live_status', ({ online }) => {
    statusBanner.classList.toggle('show', !online);
    liveEyebrow.classList.toggle('is-offline', !online);
    liveEyebrow.lastChild.textContent = online ? 'Ao vivo agora' : 'Live offline';
  });

  socket.on('viewer_count', ({ count }) => {
    viewerBadge.hidden = false;
    viewerCountEl.textContent = count.toLocaleString('pt-BR');
  });

  resetBtn.addEventListener('click', async () => {
    const confirmado = confirm('Tem certeza que quer resetar TODOS os dados salvos? Essa ação não pode ser desfeita.');
    if (!confirmado) return;
    resetBtn.disabled = true;
    resetBtn.textContent = 'Resetando...';
    try {
      await fetch('/api/reset', { method: 'POST' });
      previousTop3Ids = [];
      previousRankMap = {};
    } catch (e) {
      alert('Erro ao resetar. Verifica se o servidor está rodando.');
    } finally {
      resetBtn.disabled = false;
      resetBtn.innerHTML = '🗑️ Resetar dados';
    }
  });

  socket.on('ranking', data => {
    latestData = data;
    render();
  });

  logoutBtn.addEventListener('click', async () => {
    await fetch('/api/logout', { method: 'POST' });
    location.href = '/login.html';
  });

  function avatarOf(u) {
    return u.avatar || FALLBACK_AVATAR;
  }

  function renderPodium(list) {
    const top3 = list.slice(0, 3);
    if (!top3.length) { podiumEl.innerHTML = ''; return; }

    const medals = ['🥇', '🥈', '🥉'];
    const order = [1, 0, 2];

    podiumEl.innerHTML = order
      .filter(i => top3[i])
      .map(i => {
        const u = top3[i];
        const cls = `p${i + 1}`;
        return `
          <div class="podium-slot ${cls}" data-uid="${u.uniqueId}">
            <div class="podium-medal">${medals[i]}</div>
            <img class="podium-avatar" src="${avatarOf(u)}" onerror="this.src='${FALLBACK_AVATAR}'">
            <div class="podium-name">${u.nickname || u.uniqueId}</div>
            <div class="podium-stat">
  ${currentSort === 'comments' ? `💬 ${u.comments || 0}`
    : currentSort === 'gifts_value' ? `🎁 ${u.gifts_value}`
    : `❤️ ${u.likes}`}
</div>
            <div class="podium-bar"></div>
          </div>
        `;
      }).join('');

    podiumEl.querySelectorAll('.podium-slot').forEach(el => {
      el.addEventListener('click', () => openProfile(el.dataset.uid));
    });

    const newTop3Ids = top3.map(u => u.uniqueId);
    const enteredTop3 = newTop3Ids.filter(id => !previousTop3Ids.includes(id));
    if (previousTop3Ids.length && enteredTop3.length) {
      fireConfetti();
      playSound('levelup');
    }
    previousTop3Ids = newTop3Ids;
  }

  function render() {
    let list = latestData.filter(u => {
      if (!currentSearch) return true;
      const alvo = `${u.nickname || ''} ${u.uniqueId || ''}`.toLowerCase();
      return alvo.includes(currentSearch);
    });

    list = [...list].sort((a, b) => (b[currentSort] || 0) - (a[currentSort] || 0));

    renderPodium(list);

    if (!list.length) {
      container.innerHTML = `<div class="empty">${currentSearch ? 'Nenhum usuário encontrado.' : 'Esperando a live começar...'}</div>`;
      loadMoreBtn.style.display = 'none';
      return;
    }

    const visibleList = list.slice(0, visibleCount);
    const newRankMap = {};

    container.innerHTML = visibleList.map((u, i) => {
      newRankMap[u.uniqueId] = i;
      const prevRank = previousRankMap[u.uniqueId];
      const rankedUp = prevRank !== undefined && i < prevRank;
      const rankClass = i === 0 ? 'top1' : i === 1 ? 'top2' : i === 2 ? 'top3' : '';
      const crown = i === 0 ? '👑' : i === 1 ? '🥈' : i === 2 ? '🥉' : '';
      return `
        <div class="row ${rankClass} ${rankedUp ? 'rank-up' : ''}" data-uid="${u.uniqueId}">
          <div class="rank">${i + 1}</div>
          <img class="row-avatar" src="${avatarOf(u)}" onerror="this.src='${FALLBACK_AVATAR}'">
          <div class="name">
  ${crown ? `<span class="crown">${crown}</span>` : ''}${u.nickname || u.uniqueId}
  ${u.followed ? '<span class="badge-tag">Seguiu</span>' : ''}
  ${u.shared ? '<span class="badge-tag">🔁</span>' : ''}
</div>
<div class="stats">
  ${currentSort === 'comments'
    ? `<div class="stat">💬 <span class="val">${u.comments || 0}</span></div>`
    : `<div class="stat">❤️ <span class="val">${u.likes}</span></div>
       <div class="stat">🎁 <span class="val">${u.gifts_value}</span></div>`
  }
</div>
        </div>
      `;
    }).join('');

    container.querySelectorAll('.row').forEach(el => {
      el.addEventListener('click', () => openProfile(el.dataset.uid));
    });

    if (Object.keys(previousRankMap).length) {
      const anyoneRankedUp = Object.keys(newRankMap).some(uid =>
        previousRankMap[uid] !== undefined && newRankMap[uid] < previousRankMap[uid]
      );
      if (anyoneRankedUp) playSound('rankup');
    }
    previousRankMap = newRankMap;

    loadMoreBtn.style.display = list.length > visibleCount ? 'block' : 'none';
  }

  // ---------- HISTÓRICO DE LIVES ----------
  const historySection = document.getElementById('historySection');
  const historyToggleRow = document.getElementById('historyToggleRow');
  const historyListEl = document.getElementById('historyList');
  const toggleHistoryBtn = document.getElementById('toggleHistoryBtn');
  let historyLoaded = false;
  let historyOpen = false;

  function setHistoryOpen(open) {
    historyOpen = open;
    historySection.style.display = 'block';
    historyToggleRow.classList.toggle('open', open);
    historyListEl.classList.toggle('show', open);
    if (open) {
      historySection.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      loadHistory();
    }
  }

  toggleHistoryBtn.addEventListener('click', () => setHistoryOpen(!historyOpen));
  historyToggleRow.addEventListener('click', () => setHistoryOpen(!historyOpen));

  async function loadHistory() {
    if (historyLoaded) return;
    try {
      const res = await fetch('/api/sessions');
      const sessions = await res.json();
      historyLoaded = true;
      if (!sessions.length) {
        historyListEl.innerHTML = '<div class="modal-empty">Nenhuma live finalizada ainda.</div>';
        return;
      }
      historyListEl.innerHTML = sessions.map(s => {
        const data = new Date(s.startedAt).toLocaleString('pt-BR');
        return `
          <div class="history-item">
            <div class="when">${data} · ⏱ ${formatUptime(s.durationSeconds)}</div>
            <div class="nums">💎 ${s.totalDiamonds.toLocaleString('pt-BR')} · ❤️ ${s.totalLikes.toLocaleString('pt-BR')} · 💬 ${s.totalComments.toLocaleString('pt-BR')} · ➕ ${s.totalFollows.toLocaleString('pt-BR')} · 👀 pico ${s.peakViewers.toLocaleString('pt-BR')}</div>
          </div>
        `;
      }).join('');
    } catch (e) {
      historyListEl.innerHTML = '<div class="modal-empty">Erro ao carregar histórico.</div>';
    }
  }

  // ---------- MODAL DE PERFIL ----------
  async function openProfile(uniqueId) {
    try {
      const res = await fetch(`/api/user/${encodeURIComponent(uniqueId)}`);
      if (!res.ok) return;
      const { user, history } = await res.json();

      document.getElementById('modalAvatar').src = avatarOf(user);
      document.getElementById('modalName').textContent = user.nickname || user.uniqueId;
      document.getElementById('modalLikes').textContent = user.likes;
      document.getElementById('modalGiftsValue').textContent = user.gifts_value;
      document.getElementById('modalComments').textContent = user.comments || 0;

      const giftListEl = document.getElementById('modalGiftList');
      const commentListEl = document.getElementById('modalCommentList');

      // Na aba de comentários o perfil mostra o que a pessoa escreveu;
      // nas outras abas continua mostrando os presentes.
      const mostrarComentarios = currentSort === 'comments';
      giftListEl.style.display = mostrarComentarios ? 'none' : 'flex';
      commentListEl.style.display = mostrarComentarios ? 'flex' : 'none';

      if (mostrarComentarios) {
        const comments = history
          .filter(h => h.type === 'comment')
          .sort((a, b) => b.timestamp - a.timestamp);

        if (!comments.length) {
          commentListEl.innerHTML = `<div class="modal-empty">${
            (user.comments || 0) > 0
              ? 'Os comentários dessa pessoa não têm texto (reações/figurinhas).'
              : 'Nenhum comentário ainda.'
          }</div>`;
        } else {
          commentListEl.innerHTML =
            `<div class="modal-section-title">💬 Últimos comentários</div>` +
            comments.map(c => `
              <div class="modal-comment-row">
                ${esc(c.detail)}
                <span class="when">${new Date(c.timestamp).toLocaleTimeString('pt-BR')}</span>
              </div>
            `).join('');
        }
      } else {
        const gifts = history.filter(h => h.type === 'gift' || h.type === 'powerup');
        if (!gifts.length) {
          giftListEl.innerHTML = `<div class="modal-empty">Nenhum presente enviado ainda.</div>`;
        } else {
          giftListEl.innerHTML = gifts
            .sort((a, b) => (b.value || 0) - (a.value || 0))
            .map(g => `
              <div class="modal-gift-row">
                <span>🎁 ${esc(g.detail || 'Presente')}</span>
                <span>x${g.count || 1} — ${g.value || 0}💎</span>
              </div>
            `).join('');
        }
      }

      modalOverlay.classList.add('show');
    } catch (e) {
      console.error('Erro ao carregar perfil:', e);
    }
  }

  modalClose.addEventListener('click', () => modalOverlay.classList.remove('show'));
  modalOverlay.addEventListener('click', e => {
    if (e.target === modalOverlay) modalOverlay.classList.remove('show');
  });

  // ---------- SONS (sintetizados, sem arquivo externo) ----------
  let audioCtx;
  function playSound(type) {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);

      if (type === 'rankup') {
        osc.frequency.setValueAtTime(500, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(900, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
        osc.start(); osc.stop(audioCtx.currentTime + 0.2);
      } else if (type === 'levelup') {
        [660, 880, 1100].forEach((freq, i) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g); g.connect(audioCtx.destination);
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.08);
          g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.08 + 0.25);
          o.start(audioCtx.currentTime + i * 0.08);
          o.stop(audioCtx.currentTime + i * 0.08 + 0.25);
        });
      }
    } catch (e) { /* navegador pode bloquear áudio antes de interação do usuário */ }
  }

  // ---------- CONFETE ----------
  const confettiCanvas = document.getElementById('confetti');
  const confettiCtx = confettiCanvas.getContext('2d');
  let confettiPieces = [];
  function resizeConfetti() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeConfetti);
  resizeConfetti();

  function fireConfetti() {
    const colors = ['#ffb03a', '#ff7a1a', '#ff2d2d', '#ffe9b0'];
    for (let i = 0; i < 80; i++) {
      confettiPieces.push({
        x: confettiCanvas.width / 2 + (Math.random() - 0.5) * 200,
        y: -20,
        vx: (Math.random() - 0.5) * 6,
        vy: Math.random() * 3 + 2,
        size: Math.random() * 6 + 4,
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: Math.random() * 360,
        rotSpeed: (Math.random() - 0.5) * 10,
        life: 0
      });
    }
  }

  function tickConfetti() {
    confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
    confettiPieces.forEach(p => {
      p.x += p.vx; p.y += p.vy; p.vy += 0.08; p.rotation += p.rotSpeed; p.life++;
      confettiCtx.save();
      confettiCtx.translate(p.x, p.y);
      confettiCtx.rotate(p.rotation * Math.PI / 180);
      confettiCtx.fillStyle = p.color;
      confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
      confettiCtx.restore();
    });
    confettiPieces = confettiPieces.filter(p => p.y < confettiCanvas.height + 20 && p.life < 300);
    requestAnimationFrame(tickConfetti);
  }
  tickConfetti();

  // ---------- Partículas de fogo (fundo) ----------
  const canvas = document.getElementById('embers');
  const ctx = canvas.getContext('2d');
  let w, h;
  function resize() { w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight; }
  window.addEventListener('resize', resize);
  resize();
  const particles = Array.from({ length: 45 }, () => spawn());
  function spawn(initial) {
    return {
      x: Math.random() * w, y: initial ? Math.random() * h : h + 20,
      r: 1 + Math.random() * 2.2, speed: 0.4 + Math.random() * 1.1,
      drift: (Math.random() - 0.5) * 0.6, life: Math.random(), flicker: Math.random() * 0.02 + 0.01
    };
  }
  particles.forEach(p => Object.assign(p, spawn(true)));
  function tick() {
    ctx.clearRect(0, 0, w, h);
    particles.forEach(p => {
      p.y -= p.speed; p.x += p.drift; p.life += p.flicker;
      const alpha = 0.5 + Math.sin(p.life * 10) * 0.3;
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 4);
      grad.addColorStop(0, `rgba(255, 170, 60, ${Math.max(alpha, 0)})`);
      grad.addColorStop(1, 'rgba(255, 60, 20, 0)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 4, 0, Math.PI * 2); ctx.fill();
      if (p.y < -20 || p.x < -20 || p.x > w + 20) Object.assign(p, spawn(false));
    });
    requestAnimationFrame(tick);
  }
  tick();
</script>
</body>
</html>
