<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin · TEM LEÃO NA MIRA!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
<link rel="icon" href="/assets/mira-logo.png">
<link rel="stylesheet" href="/assets/theme.css">
<style>
  /* Só o administrador chega aqui: o servidor barra no requireAdmin antes de
     entregar a página, e cada rota da API confere de novo. */
  body { background: var(--bg); color: var(--ink); font-family: Inter, system-ui, sans-serif; margin: 0; }
  main { max-width: 820px; margin: 0 auto; padding: 24px 16px 48px; }
  .topo { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  h1, h2 { font-family: "Space Grotesk", Inter, sans-serif; letter-spacing: -.02em; }
  h1 { margin: 0; font-size: 22px; text-transform: uppercase; }
  .cabeca { display: flex; align-items: center; gap: 14px; }
  .cabeca img { width: 84px; height: 42px; object-fit: contain; }
  .topo a { color: var(--gold); }
  ::selection { background: #e32636; color: #fff; }
  .caixa { background: var(--card); border: 1px solid var(--line); border-radius: 4px; padding: 16px; margin-bottom: 20px; }
  form { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  label { display: grid; gap: 6px; font-size: 13px; color: var(--ink-dim); }
  label.marca { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; color: var(--ink); }
  input[type=text], select {
    background: var(--card-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 10px; font: inherit; width: 100%;
  }
  .acoes { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; }
  button {
    font: inherit; font-weight: 600; border-radius: 4px; padding: 9px 14px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card-3); color: var(--ink);
  }
  button.principal { background: #e32636; border-color: #e32636; color: #fff; text-transform: uppercase; letter-spacing: .06em; font-size: 13px; }
  button.principal:hover { background: var(--gold); border-color: var(--gold); }
  button.perigo { color: var(--red); }
  .msg { min-height: 20px; font-size: 14px; margin-top: 10px; }
  .msg.erro { color: var(--red); }
  .msg.ok { color: var(--green); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--ink-dim); font-weight: 600; font-size: 12px; text-transform: uppercase; }
  td.btns { white-space: nowrap; text-align: right; }
  .sim { color: var(--green); font-weight: 700; }
  .nao { color: var(--ink-dim); }
  .vazio { color: var(--ink-dim); text-align: center; padding: 20px; }
  h2 { margin: 0 0 12px; font-size: 16px; }
  .status { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .status li {
    display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 4px 10px;
    padding: 10px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--card-2);
  }
  .status .bola { width: 10px; height: 10px; border-radius: 50%; background: var(--ink-dim); }
  .status .on .bola { background: var(--green); box-shadow: 0 0 8px var(--green); }
  .status .arroba { font-weight: 700; overflow: hidden; text-overflow: ellipsis; }
  .status .estado { font-size: 13px; font-weight: 600; color: var(--ink-dim); }
  .status .on .estado { color: var(--green); }
  .status .quando, .status .recado, .status .detalhe { grid-column: 2 / -1; font-size: 12.5px; color: var(--ink-dim); }
  .status .detalhe.falha { color: var(--red); font-weight: 600; }
  .status .numeros { grid-column: 2 / -1; display: flex; gap: 4px 18px; flex-wrap: wrap; margin-top: 4px; font-size: 13px; color: var(--ink-dim); }
  .status .numeros b { font-size: 16px; color: var(--ink); }
  .status li.vazio { display: block; }
  input[type=datetime-local] {
    background: var(--card-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 10px; font: inherit; width: 100%; color-scheme: dark;
  }
  .origem { grid-column: 1 / -1; margin: 0; font-size: 12.5px; color: var(--ink-dim); }
  input[type=password] {
    background: var(--card-2); color: var(--ink); border: 1px solid var(--line);
    border-radius: 4px; padding: 10px; font: inherit; width: 100%;
  }
  label.inteira { grid-column: 1 / -1; }
  form.linha { display: flex; gap: 8px; flex-wrap: wrap; }
  form.linha input { flex: 1 1 180px; width: auto; }
  .status .botoes { grid-column: 2 / -1; display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px; }
  .status .botoes button, .pessoas button { padding: 5px 10px; font-size: 13px; }
  .pessoas { list-style: none; margin: 0 0 14px; padding: 0; display: grid; gap: 6px; }
  .pessoas li {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    padding: 8px 12px; border: 1px solid var(--line); border-radius: 4px; background: var(--card-2);
  }
  .pessoas li.vazio { display: block; border: 0; background: none; }
  .pessoas .voce { font-size: 12.5px; color: var(--ink-dim); }
  .fora { font-size: 12px; color: var(--ink-dim); }
  @media (max-width: 560px) {
    form { grid-template-columns: 1fr; }
    thead { display: none; }
    tr { display: grid; grid-template-columns: 1fr auto; padding: 8px 0; border-bottom: 1px solid var(--line); }
    td { border: 0; padding: 4px 0; }
    td.btns { grid-column: 1 / -1; text-align: left; }
  }
</style>
</head>
<body>
<main>
  <div class="topo">
    <div class="cabeca">
      <img src="/assets/mira-logo.png" alt="MIRA" width="84" height="42">
      <h1>Tem leão na mira! 🎯</h1>
    </div>
    <div>
      <a href="/mira.html" target="_blank" rel="noopener">Ver ranking</a>
      &nbsp;
      <button type="button" id="sair">Sair</button>
    </div>
  </div>

  <div class="caixa">
    <h2>Snipers</h2>
    <form id="formSniper" class="linha">
      <input type="text" id="novoSniper" required maxlength="25" autocomplete="off" placeholder="@do_sniper" aria-label="@ do sniper">
      <button type="submit" class="principal">Adicionar sniper</button>
    </form>
    <div class="msg" id="msgSniper"></div>
    <ul class="status" id="status"><li class="vazio">Carregando…</li></ul>
  </div>

  <div class="caixa">
    <h2>Período da campanha</h2>
    <form id="formPeriodo">
      <label>Início
        <input type="datetime-local" id="inicio" required>
      </label>
      <label>Fim
        <input type="datetime-local" id="fim" required>
      </label>
      <p class="origem" id="origemPeriodo"></p>
      <div class="acoes">
        <button type="submit" class="principal">Salvar período</button>
        <button type="button" id="padraoPeriodo" hidden>Voltar ao padrão</button>
      </div>
    </form>
    <div class="msg" id="msgPeriodo"></div>
  </div>

  <div class="caixa">
    <h2>Indicações</h2>
    <form id="form">
      <label>Quem indicou (sniper)
        <select name="indicador" id="indicador" required></select>
      </label>
      <label>@ do indicado
        <input type="text" name="indicado" id="indicado" required maxlength="25" autocomplete="off" placeholder="@amigo">
      </label>
      <label class="marca">
        <input type="checkbox" name="oficial" id="oficial">
        Entrou oficialmente na MIRA e fez a primeira live (vale ponto)
      </label>
      <div class="acoes">
        <button type="submit" class="principal" id="salvar">Adicionar</button>
        <button type="button" id="cancelar" hidden>Cancelar edição</button>
      </div>
    </form>
    <div class="msg" id="msg"></div>
  </div>

  <div class="caixa">
    <table>
      <thead><tr><th>Indicou</th><th>Indicado</th><th>Vale ponto?</th><th></th></tr></thead>
      <tbody id="lista"></tbody>
    </table>
  </div>

  <div class="caixa">
    <h2>Administradores</h2>
    <ul class="pessoas" id="admins"><li class="vazio">Carregando…</li></ul>
    <form id="formAdmin">
      <label>Usuário
        <input type="text" id="novoAdmin" required maxlength="40" autocomplete="off" autocapitalize="none" spellcheck="false">
      </label>
      <label>Senha inicial
        <input type="password" id="senhaNovoAdmin" required minlength="6" autocomplete="new-password">
      </label>
      <div class="acoes">
        <button type="submit" class="principal">Adicionar administrador</button>
      </div>
    </form>
    <div class="msg" id="msgAdmin"></div>
  </div>

  <div class="caixa">
    <h2>Minha senha</h2>
    <form id="formSenha">
      <label class="inteira">Senha atual
        <input type="password" id="senhaAtual" required autocomplete="current-password">
      </label>
      <label>Nova senha
        <input type="password" id="senhaNova" required minlength="6" autocomplete="new-password">
      </label>
      <label>Repita a nova senha
        <input type="password" id="senhaNova2" required minlength="6" autocomplete="new-password">
      </label>
      <div class="acoes">
        <button type="submit" class="principal">Trocar senha</button>
      </div>
    </form>
    <div class="msg" id="msgSenha"></div>
  </div>
</main>

<script>
  const $ = id => document.getElementById(id);
  let editando = null;   // id da indicação em edição, ou null
  let itens = [];
  let snipersAtuais = [];

  function el(tag, classe, texto) {
    const e = document.createElement(tag);
    if (classe) e.className = classe;
    if (texto !== undefined) e.textContent = texto;
    return e;
  }

  function aviso(texto, tipo) {
    $('msg').textContent = texto || '';
    $('msg').className = 'msg ' + (tipo || '');
  }

  // sessão vencida ou sem admin: volta pro login e retorna pra cá depois
  function paraOLogin() {
    location.href = '/login.html?next=' + encodeURIComponent('/mira-admin.html');
  }

  async function api(metodo, url, corpo) {
    const r = await fetch(url, {
      method: metodo,
      headers: corpo ? { 'Content-Type': 'application/json' } : {},
      body: corpo ? JSON.stringify(corpo) : undefined
    });
    if (r.status === 401 || r.status === 403) { paraOLogin(); throw new Error('sem acesso'); }
    const dados = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(dados.error || 'Algo deu errado.');
    return dados;
  }

  function desenhar() {
    const lista = $('lista');
    lista.replaceChildren();
    if (!itens.length) {
      const tr = el('tr'); const td = el('td', 'vazio', 'Nenhuma indicação cadastrada.');
      td.colSpan = 4; tr.append(td); lista.append(tr);
      return;
    }
    itens.forEach(i => {
      const tr = el('tr');
      const btns = el('td', 'btns');
      const editar = el('button', '', 'Editar');
      editar.type = 'button';
      editar.onclick = () => comecarEdicao(i);
      const remover = el('button', 'perigo', 'Remover');
      remover.type = 'button';
      remover.onclick = () => removerItem(i);
      btns.append(editar, ' ', remover);
      // indicação de quem saiu da lista fica guardada, mas não conta ponto
      const quem = el('td', '', '@' + i.indicador);
      if (!snipersAtuais.includes(i.indicador)) quem.append(' ', el('span', 'fora', '(fora da campanha)'));
      tr.append(
        quem,
        el('td', '', '@' + i.indicado),
        el('td', i.oficial ? 'sim' : 'nao', i.oficial ? 'Sim' : 'Ainda não'),
        btns
      );
      lista.append(tr);
    });
  }

  async function carregar() {
    const dados = await api('GET', '/api/mira/indicacoes');
    const sel = $('indicador');
    const escolhido = sel.value;
    sel.replaceChildren();
    dados.snipers.forEach(s => {
      const o = el('option', '', '@' + s); o.value = s; sel.append(o);
    });
    if (!dados.snipers.length) {
      aviso('Nenhum sniper na campanha ainda. Adicione em "Snipers", lá em cima.', 'erro');
    }
    if (escolhido) sel.value = escolhido;
    snipersAtuais = dados.snipers;
    itens = dados.indicacoes;
    desenhar();
  }

  function comecarEdicao(i) {
    editando = i.id;
    $('indicador').value = i.indicador;
    $('indicado').value = i.indicado;
    $('oficial').checked = !!i.oficial;
    $('salvar').textContent = 'Salvar alteração';
    $('cancelar').hidden = false;
    aviso('');
    $('indicado').focus();
  }

  function limparForm() {
    editando = null;
    $('form').reset();
    $('salvar').textContent = 'Adicionar';
    $('cancelar').hidden = true;
  }

  async function removerItem(i) {
    if (!confirm(`Remover a indicação de @${i.indicado} por @${i.indicador}?`)) return;
    try {
      await api('DELETE', '/api/mira/indicacoes/' + encodeURIComponent(i.id));
      if (editando === i.id) limparForm();
      aviso('Indicação removida.', 'ok');
      await carregar();
    } catch (e) { aviso(e.message, 'erro'); }
  }

  $('form').addEventListener('submit', async ev => {
    ev.preventDefault();
    const corpo = {
      indicador: $('indicador').value,
      indicado: $('indicado').value,
      oficial: $('oficial').checked
    };
    try {
      if (editando) await api('PUT', '/api/mira/indicacoes/' + encodeURIComponent(editando), corpo);
      else await api('POST', '/api/mira/indicacoes', corpo);
      aviso(editando ? 'Indicação atualizada.' : 'Indicação adicionada.', 'ok');
      limparForm();
      await carregar();
    } catch (e) { aviso(e.message, 'erro'); }
  });

  // ---------- status das lives ----------
  // "Atualizado" é a última vez que o servidor soube algo da live: o último
  // evento do TikTok com ela no ar, ou a última checagem com ela fora do ar.
  function horario(ms, agora) {
    const d = new Date(ms);
    const hoje = new Date(agora).toDateString() === d.toDateString();
    const hora = d.toLocaleTimeString('pt-BR');
    const texto = hoje ? hora : d.toLocaleDateString('pt-BR') + ' ' + hora;
    const min = Math.floor((agora - ms) / 60000);
    return texto + (min >= 1 ? ` (há ${min} min)` : ' (agora há pouco)');
  }

  function quando(ms, agora) {
    return ms ? 'Atualizado às ' + horario(ms, agora) : 'Sem notícia desde que o servidor subiu';
  }

  // ---------- diamantes e tempo de live de cada sniper ----------
  const milhar = n => n.toLocaleString('pt-BR');
  const emLives = n => (n === 1 ? '1 live' : milhar(n) + ' lives');

  function duracao(segundos) {
    const h = Math.floor(segundos / 3600);
    const min = Math.floor((segundos % 3600) / 60);
    return h ? `${milhar(h)}h ${min}min` : `${min}min`;
  }

  function numero(valor, rotulo) {
    const span = el('span');
    span.append(el('b', '', valor), ' ' + rotulo);
    return span;
  }

  function linhasDosNumeros({ noPeriodo, tudo, gravacao }, agora) {
    const numeros = el('span', 'numeros');
    numeros.title = 'O que conta pro ranking: só o que está dentro do período da campanha';
    numeros.append(
      numero(milhar(noPeriodo.diamantes), 'diamantes'),
      numero(duracao(noPeriodo.segundos), 'de live'),
      numero(emLives(noPeriodo.lives), 'no período')
    );
    const linhas = [numeros];
    if (tudo.diamantes !== noPeriodo.diamantes || tudo.segundos !== noPeriodo.segundos) {
      linhas.push(el('span', 'detalhe',
        `Contando fora do período: ${milhar(tudo.diamantes)} diamantes, ${duracao(tudo.segundos)} de live, ${emLives(tudo.lives)}`));
    }
    if (gravacao.erro) {
      linhas.push(el('span', 'detalhe falha', 'Falha ao gravar no banco: ' + gravacao.erro));
    } else {
      linhas.push(el('span', 'detalhe', gravacao.em
        ? 'Gravado no banco às ' + horario(gravacao.em, agora)
        : 'Nada novo pra gravar no banco desde que o servidor subiu'));
    }
    return linhas;
  }

  async function carregarStatus() {
    const dados = await api('GET', '/api/mira/status');
    const ul = $('status');
    ul.replaceChildren();
    if (!dados.snipers.length) {
      ul.append(el('li', 'vazio', 'Nenhum sniper na campanha. Adicione o primeiro aqui em cima.'));
      return;
    }
    dados.snipers.forEach(s => {
      const li = el('li', s.conectado ? 'on' : '');
      const botoes = el('span', 'botoes');
      const reconectar = el('button', '', 'Reconectar');
      reconectar.type = 'button';
      reconectar.title = 'Derruba a conexão e confere de novo se a live está no ar';
      reconectar.onclick = () => reconectarSniper(s.arroba);
      const remover = el('button', 'perigo', 'Remover');
      remover.type = 'button';
      remover.onclick = () => removerSniper(s.arroba);
      botoes.append(reconectar, remover);
      li.append(
        el('span', 'bola'),
        el('span', 'arroba', '@' + s.arroba),
        el('span', 'estado', s.conectado ? 'Live conectada' : 'Desconectada'),
        el('span', 'quando', quando(s.atualizadoEm, dados.agora))
      );
      if (s.numeros) li.append(...linhasDosNumeros(s.numeros, dados.agora));
      if (s.recado) li.append(el('span', 'recado', s.recado));
      li.append(botoes);
      ul.append(li);
    });
  }

  // ---------- snipers: entrar, sair, reconectar ----------
  function avisoSniper(texto, tipo) {
    $('msgSniper').textContent = texto || '';
    $('msgSniper').className = 'msg ' + (tipo || '');
  }

  // a lista de snipers também é a do campo "Quem indicou"
  async function snipersMudaram() {
    await Promise.all([carregarStatus(), carregar()]);
  }

  $('formSniper').addEventListener('submit', async ev => {
    ev.preventDefault();
    try {
      const r = await api('POST', '/api/mira/snipers', { arroba: $('novoSniper').value });
      $('novoSniper').value = '';
      avisoSniper(`@${r.arroba} entrou na campanha. A live dele já está sendo acompanhada.`, 'ok');
      await snipersMudaram();
    } catch (e) { avisoSniper(e.message, 'erro'); }
  });

  async function removerSniper(arroba) {
    if (!confirm(`Tirar @${arroba} da campanha?\n\nA live dele deixa de ser acompanhada e ele sai do ranking. ` +
                 'O histórico e as indicações ficam guardados: se ele voltar pra lista, volta com tudo ' +
                 '(menos as lives que acontecerem enquanto estiver fora).')) return;
    try {
      await api('DELETE', '/api/mira/snipers/' + encodeURIComponent(arroba));
      avisoSniper(`@${arroba} saiu da campanha.`, 'ok');
      await snipersMudaram();
    } catch (e) { avisoSniper(e.message, 'erro'); }
  }

  async function reconectarSniper(arroba) {
    try {
      await api('POST', '/api/mira/snipers/' + encodeURIComponent(arroba) + '/reconectar');
      avisoSniper(`Reconectando @${arroba}… o status atualiza em alguns segundos.`, 'ok');
      setTimeout(atualizarStatus, 10000);
    } catch (e) { avisoSniper(e.message, 'erro'); }
  }

  // ---------- administradores ----------
  function avisoAdmin(texto, tipo) {
    $('msgAdmin').textContent = texto || '';
    $('msgAdmin').className = 'msg ' + (tipo || '');
  }

  async function carregarAdmins() {
    const dados = await api('GET', '/api/mira/admins');
    const ul = $('admins');
    ul.replaceChildren();
    dados.admins.forEach(nome => {
      const li = el('li');
      li.append(el('span', '', nome));
      if (nome === dados.voce) {
        li.append(el('span', 'voce', 'você'));
      } else {
        const remover = el('button', 'perigo', 'Remover');
        remover.type = 'button';
        remover.onclick = () => removerAdmin(nome);
        li.append(remover);
      }
      ul.append(li);
    });
  }

  $('formAdmin').addEventListener('submit', async ev => {
    ev.preventDefault();
    const usuario = $('novoAdmin').value.trim();
    try {
      await api('POST', '/api/mira/admins', { usuario, senha: $('senhaNovoAdmin').value });
      $('formAdmin').reset();
      avisoAdmin(`"${usuario}" agora é administrador. Passe a senha pra ele por um canal seguro.`, 'ok');
      await carregarAdmins();
    } catch (e) { avisoAdmin(e.message, 'erro'); }
  });

  async function removerAdmin(nome) {
    if (!confirm(`Tirar o acesso de administrador de "${nome}"? Se estiver logado, ele sai na próxima ação.`)) return;
    try {
      await api('DELETE', '/api/mira/admins/' + encodeURIComponent(nome));
      avisoAdmin(`"${nome}" não é mais administrador.`, 'ok');
      await carregarAdmins();
    } catch (e) { avisoAdmin(e.message, 'erro'); }
  }

  // ---------- minha senha ----------
  function avisoSenha(texto, tipo) {
    $('msgSenha').textContent = texto || '';
    $('msgSenha').className = 'msg ' + (tipo || '');
  }

  $('formSenha').addEventListener('submit', async ev => {
    ev.preventDefault();
    if ($('senhaNova').value !== $('senhaNova2').value) return avisoSenha('As duas senhas novas não batem.', 'erro');
    try {
      await api('POST', '/api/mira/minha-senha', { atual: $('senhaAtual').value, nova: $('senhaNova').value });
      $('formSenha').reset();
      avisoSenha('Senha trocada.', 'ok');
    } catch (e) { avisoSenha(e.message, 'erro'); }
  });

  function atualizarStatus() {
    carregarStatus().catch(e => {
      $('status').replaceChildren(el('li', 'vazio', 'Não consegui ler o status: ' + e.message));
    });
  }

  // a cada 30s, e só com a aba à vista: ninguém precisa de status em aba escondida
  setInterval(() => { if (!document.hidden) atualizarStatus(); }, 30000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) atualizarStatus(); });

  // ---------- período da campanha ----------
  // O campo datetime-local é a hora do relógio de quem está usando (Brasília,
  // pro admin daqui); o servidor recebe e guarda em milissegundos, sem fuso.
  const dois = n => String(n).padStart(2, '0');
  function paraCampo(ms) {
    const d = new Date(ms);
    return `${d.getFullYear()}-${dois(d.getMonth() + 1)}-${dois(d.getDate())}T${dois(d.getHours())}:${dois(d.getMinutes())}`;
  }
  const doCampo = texto => (texto ? new Date(texto).getTime() : NaN);

  function avisoPeriodo(texto, tipo) {
    $('msgPeriodo').textContent = texto || '';
    $('msgPeriodo').className = 'msg ' + (tipo || '');
  }

  function mostrarPeriodo(p) {
    $('inicio').value = paraCampo(p.inicio);
    // o fim é guardado no último milissegundo do minuto escolhido; o campo
    // mostra só até o minuto, então 23:59:59 aparece como 23:59
    $('fim').value = paraCampo(p.fim);
    $('origemPeriodo').textContent = p.origem === 'admin'
      ? `Definido${p.autor ? ' por ' + p.autor : ''} em ${new Date(p.em).toLocaleString('pt-BR')}.`
      : 'Usando o padrão do servidor (MIRA_INICIO/MIRA_FIM ou campanha.config.js).';
    $('padraoPeriodo').hidden = p.origem !== 'admin';
  }

  async function carregarPeriodo() {
    mostrarPeriodo((await api('GET', '/api/mira/periodo')).periodo);
  }

  $('formPeriodo').addEventListener('submit', async ev => {
    ev.preventDefault();
    const inicio = doCampo($('inicio').value);
    // fim inclui o minuto escolhido inteiro: "30/11 23:59" vale até 23:59:59
    const fim = doCampo($('fim').value) + 59999;
    if (!confirm('Mudar o período recalcula o ranking na hora. Lives fora do novo período deixam de contar. Continuar?')) return;
    try {
      const r = await api('PUT', '/api/mira/periodo', { inicio, fim });
      mostrarPeriodo(r.periodo);
      avisoPeriodo('Período salvo. O ranking já usa as novas datas.', 'ok');
    } catch (e) { avisoPeriodo(e.message, 'erro'); }
  });

  $('padraoPeriodo').onclick = async () => {
    if (!confirm('Voltar ao período padrão do servidor? O ranking é recalculado na hora.')) return;
    try {
      const r = await api('DELETE', '/api/mira/periodo');
      mostrarPeriodo(r.periodo);
      avisoPeriodo('Voltou ao período padrão.', 'ok');
    } catch (e) { avisoPeriodo(e.message, 'erro'); }
  };

  $('cancelar').onclick = () => { limparForm(); aviso(''); };

  $('sair').onclick = async () => {
    try { await fetch('/api/logout', { method: 'POST' }); } catch (e) { /* sai do mesmo jeito */ }
    paraOLogin();
  };

  carregar().catch(e => aviso(e.message, 'erro'));
  atualizarStatus();
  carregarPeriodo().catch(e => avisoPeriodo(e.message, 'erro'));
  carregarAdmins().catch(e => avisoAdmin(e.message, 'erro'));
</script>
</body>
</html>
